<!DOCTYPE html>
<html lang="en">
<head>

<title>GreenKey Field</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* touch-action pan-only: finger drags scroll, but two-finger pinch-zoom is
     ignored — keeps the app locked to its single-column layout on the iPad. */
  html,body{margin:0;background:#0f1117;color:#e8eaed;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;font-size:16px;line-height:1.4;touch-action:pan-x pan-y}
  /* Read-only text is non-selectable so a finger-drag always scrolls; inputs re-enabled. */
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
  input,textarea{-webkit-user-select:text;user-select:text}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:640px;margin:0 auto;padding:12px}
  .muted{color:#8b93a1}
  .top{position:sticky;top:0;z-index:5;background:#0f1117;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;border-bottom:1px solid #1d222c}
  .top .ttl{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-size:13px;font-weight:700;letter-spacing:.3px}
  .brand .b2{color:#36c777}
  .build{font-size:10px;color:#5d6675}
  h1{font-size:22px;font-weight:700;margin:8px 0 2px}
  /* Detail views (field-14): the title row IS the way back. h1 becomes a tappable
     "‹ My Jobs" in brand green; the view name moves to a small right-hand label. */
  .h1row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .h1row h1.hback{color:#36c777;cursor:pointer}
  .hlab{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#8b93a1;flex-shrink:0}
  .srch{width:100%;margin-top:10px;padding:11px 12px;border:1px solid #262b36;border-radius:10px;background:#171a21;color:#e8eaed;font-size:15px;outline:none}
  /* SMS composer (field-13). Phone-style multi-line box: THREE lines visible at
     rest so a whole text can be read back and reworded before sending, growing
     to ~8 lines and then scrolling. Heights are in em so they track the font
     size; box-sizing is border-box globally, hence the +20px for padding+border.
     resize:none because the drag handle fights the pan-scroll gesture on iOS. */
  .smsbox{flex:1;min-width:0;background:#0d1117;border:1px solid #2a3140;border-radius:10px;color:#e8eaed;font-family:inherit;font-size:15px;line-height:1.35;padding:9px 12px;outline:none;resize:none;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:calc(4.05em + 20px);max-height:calc(10.8em + 20px)}
  /* Compact square button for the "from Photos" pickers next to a camera button. */
  .ibtn{background:#171a21;color:#e8eaed;border:1px solid #2a313d;border-radius:10px;padding:8px 11px;font-size:15px;flex:0 0 auto;cursor:pointer;line-height:1}
  .sec{margin:18px 0 6px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#8b93a1}
  .card{display:block;background:#171a21;border:1px solid #262b36;border-radius:12px;padding:14px;margin-bottom:10px;content-visibility:auto;contain-intrinsic-size:0 92px}
  .card:active{background:#1c2027}
  .jrow{display:flex;align-items:center;gap:10px}
  .jname{font-size:16px;font-weight:600;line-height:1.25}
  .jaddr{font-size:13px;color:#aeb4bf;margin-top:2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{font-size:11px;padding:3px 8px;border-radius:20px;background:#0f1117;border:1px solid #2a313d;color:#aeb4bf}
  .chip.blue{background:rgba(54,140,255,.14);border-color:transparent;color:#6db0ff}
  .chip.amber{background:rgba(255,176,32,.14);border-color:transparent;color:#ffc861}
  .chev{margin-left:auto;color:#5d6675;flex-shrink:0}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:12px;font-size:16px;font-weight:600;border:none;width:100%;cursor:pointer}
  .btn.green{background:#36c777;color:#08130c}
  .btn.ghost{background:#171a21;color:#e8eaed;border:1px solid #2a313d}
  .row2{display:flex;gap:10px;margin:12px 0}
  .row2 a,.row2 .btn{flex:1}   /* .btn is width:100% — flex-basis 0 makes them share the row */
  .back{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:#aeb4bf;padding:6px 0;margin-bottom:4px}
  .lab{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#8b93a1;margin-bottom:6px}
  .scope{font-size:15px;line-height:1.55;white-space:pre-wrap;color:#dfe3e9}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .pcell{aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid #262b36;background:#11141a;content-visibility:auto;contain-intrinsic-size:96px 96px;cursor:pointer;position:relative}
  .pcell img{width:100%;height:100%;object-fit:cover;display:block}
  /* field-21: a queued (on-phone, not-yet-uploaded) photo is marked on its tile */
  .pcell.q{border-color:#8a6d2f}
  .pcell .pq{position:absolute;right:3px;bottom:3px;font-size:11px;line-height:1;background:rgba(0,0,0,.6);border-radius:6px;padding:2px 4px}
  .pqbar{background:#2b2415;border:1px solid #8a6d2f;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.35;color:#f0d9a5;margin:8px 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pqbar .chip{margin-left:auto;flex:0 0 auto}
  .pqok{color:#36c777;font-size:12.5px;margin:6px 0 2px}
  /* Photo lightbox (field-15) — photos open IN the app. target=_blank to the
     SharePoint download link gave iOS standalone a dead white overlay. */
  .lb{position:fixed;inset:0;z-index:50;background:rgba(4,6,10,.94);display:flex;align-items:center;justify-content:center;touch-action:none}
  .lb img{max-width:100vw;max-height:86vh;object-fit:contain;will-change:transform}
  .lb .lbx{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:12px;font-size:24px;color:#e8eaed;padding:10px;cursor:pointer}
  .lb .lbdel{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:12px;font-size:19px;color:#ff9a9a;background:rgba(23,26,33,.62);border:1px solid #4a2a2a;border-radius:10px;padding:7px 12px;cursor:pointer}
  .lb .lbnav{position:absolute;top:50%;transform:translateY(-50%);font-size:32px;line-height:1;color:#e8eaed;padding:16px 12px;background:rgba(23,26,33,.55);border-radius:12px;cursor:pointer}
  .lb .lbcap{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);left:12px;right:12px;text-align:center;color:#aeb4bf;font-size:12px}
  .pay{background:linear-gradient(135deg,rgba(54,199,119,.16),rgba(54,199,119,.05));border:1px solid #2f6b46;border-radius:12px;padding:14px;margin-bottom:12px}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:24px;gap:14px}
  .spin{width:34px;height:34px;border:3px solid #262b36;border-top-color:#36c777;border-radius:50%;animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{color:#ff8a8a;font-size:14px}
  .empty{color:#8b93a1;text-align:center;padding:40px 12px;font-size:14px}
  /* Update bar (field-13) — see checkForUpdate(). Fixed above the home indicator
     so it never reflows the page out from under someone mid-job. */
  .updbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:#12351f;border-top:1px solid #2b6a41;box-shadow:0 -6px 18px rgba(0,0,0,.35)}
  .updbar .t{flex:1;min-width:0;font-size:14px;line-height:1.3;color:#d9f2e2}
  .updbar button{flex:0 0 auto;border:none;border-radius:10px;font-size:15px;font-weight:600;padding:10px 14px;cursor:pointer;font-family:inherit}
  .updbar .go{background:#36c777;color:#08130c}
  .updbar .x{background:transparent;color:#8fb9a2;padding:10px 6px;font-size:16px}
</style>

<body>
<div id="app"><div class="center"><div class="spin"></div><div class="muted">Connecting…</div></div></div>

<script>
// ============ GreenKey Field — lean mobile tool (Phase 1: read) ============
const BUILD = '2026-09-02 field-30';
// Memo code shown with the Zelle QR so the deposit self-identifies at the bank.
// MUST match payMemoCode() in the CRM's index.html.
function payMemoCode(id){ const d=String(id||'').replace(/[^0-9]/g,''); return 'GK-'+(d.slice(-4)||'0000'); }
const AZURE_CLIENT_ID = '61b4a86a-2b6f-4e14-90f9-a8df8ecadf69';
const AZURE_TENANT_ID = '48b33cc0-0d51-46d6-8b85-53b6ebfc0b0f';
const FIELD_URL       = location.origin + location.pathname; // this page
// 2026-07-13 (Phase 2 auth): redirect is now THIS page, so a cold device (an
// iPad or a tech's phone that never opened the main CRM) can sign in directly
// and land back here. ⚠ REQUIRES the one-time Azure step BEFORE this deploys:
// portal.azure.com → App registrations → the CRM app (61b4a86a…) →
// Authentication → Single-page application → Add URI:
//   https://jonathanallen-ctrl.github.io/greenkey-crm/field.html
// (Adding a URI doesn't affect the main CRM. Warm devices keep working either way.)
const AUTH_REDIRECT   = 'https://jonathanallen-ctrl.github.io/greenkey-crm/field.html';
const SP_HOSTNAME     = 'greenkeyusa.sharepoint.com';
const SP_LIST_NAME    = 'GreenKeyCRM_Data';
const SP_PHOTO_LIB    = 'CEO/CRM software/GreenKeyCRM_Photos';
const GRAPH_SCOPES    = ['https://graph.microsoft.com/Sites.ReadWrite.All','User.Read'];
const ZELLE_EMAIL     = 'jonathan.allen@greenkey-usa.com';
const PLATFORMS       = ['Qmerit','Electrum','Treehouse'];
// SMS Relay worker (same as the main CRM) — used to create + text a Stripe
// payment link. The main CRM and this app share the same Azure client app, so
// the SMS.send scope is already consented; the token acquires silently.
const SMS_WORKER_URL  = 'https://link.greenkey-usa.com';   // 2026-08-19: custom domain — customer links (Stripe pay link texts etc.) mint from GreenKey's own domain, not workers.dev
const SMS_SCOPE_URL   = 'api://f4704bd1-8316-4740-8f59-540901153810/SMS.send';

let _msal=null,_gToken=null,_spSite=null,_spList=null,_spDrive=null;
const $app = ()=>document.getElementById('app');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- data (shared localStorage with the main CRM) ----------
function getLeads(){ try{return JSON.parse(localStorage.getItem('gk_leads')||'[]')}catch(e){return[]} }
function getCustomers(){ try{return JSON.parse(localStorage.getItem('gk_customers')||'[]')}catch(e){return[]} }
function getCustomer(id){ return getCustomers().find(c=>c.id===id)||null; }
function custName(l){ const c=l.customerId?getCustomer(l.customerId):null; if(c){ const n=((c.firstName||'')+' '+(c.lastName||'')).trim(); return n||c.businessName||l.customerName||l.id; } return l.customerName||((l.customerFirstName||'')+' '+(l.customerLastName||'')).trim()||l.id; }
function leadAddr(l){ return [l.siteStreet,l.siteCity,l.siteState||'VA',l.siteZip].filter(Boolean).join(', '); }
function leadPhone(l){ const c=l.customerId?getCustomer(l.customerId):null; return (c&&c.phone)||l.customerPhone||''; }
function prettyType(t){ if(!t) return ''; return String(t).replace(/[-_]/g,' ').replace(/\b\w/g,m=>m.toUpperCase()); }
function schedDate(l){ return (l.milestones&&l.milestones.installScheduled&&l.milestones.installScheduled.date)||l.scheduleAt||''; }
// ── APPOINTMENTS (2026-07-31) ──
// The CRM moved to lead.appointments[] so a job can hold more than one visit.
// Only INSTALLATION appointments mirror back into milestones.installScheduled,
// which is what schedDate() reads — so a scheduled WALKDOWN had no date the
// field app could see, and only surfaced if the job happened to be sitting in
// the 'info-gathering' stage. Scheduling a walkdown deliberately does NOT move
// the stage any more, so in practice they never appeared at all: Chase did two
// on 2026-07-30 and had to photograph and text everything by hand.
// Mirrors getAppts() in index.html — keep the two in step.
var WALKDOWN_TYPES = ['walkdown','phone-call'];
// ⚠ 2026-08-25 (field-25) — THE DAY THE CREW'S "TODAY" CAME UP EMPTY.
// The old first line was `if(Array.isArray(l.appointments)) return l.appointments;`
// so ANY appointments array short-circuited the legacy synthesis below —
// including an array holding only an undated "Needs scheduling" placeholder.
// That is exactly what the CRM's Scheduled pill produces (it wrote
// milestones.installScheduled and never touched appointments[]), so three jobs
// booked for the day read "Scheduled · 08/25/2026" in the office and landed in
// "In progress" here, because renderJobs() builds Today only from DATED appts.
// Now the synthesis fires whenever no DATED install appointment exists.
// Dated walkdowns/inspections in the array are preserved untouched.
// ⚠ Mirrors getAppts() in index.html — keep the two in step.
function apptsOf(l){
  if(!l) return [];
  var arr = Array.isArray(l.appointments) ? l.appointments : [];
  var im = l.milestones && l.milestones.installScheduled;
  // An untyped appointment counts as the install — that is how the legacy
  // synthesized record has always been typed.
  var hasDatedInstall = arr.some(function(a){ return a && a.date && (a.type==='installation' || !a.type); });
  if(hasDatedInstall || !(im && im.date)) return arr;
  return arr.concat([{id:'appt-legacy-install',type:'installation',date:im.date,time:im.time||''}]);
}
function apptLabel(t){
  // Jon's 7 visit types (2026-09-02) + retired labels for old bookings.
  var M={installation:'Installation','charger-swap':'Charger Swap',walkdown:'Site Visit','phone-call':'Phone/Video Walkdown',troubleshoot:'Service Call',inspection:'Onsite Inspection',other:'Visit',maintenance:'Maintenance','quote-review':'Quote Review','material-pickup':'Material Pickup','follow-up':'Follow-Up'};
  return M[t]||'Visit';
}
function isWalkdownAppt(a){ return !!a && WALKDOWN_TYPES.indexOf(a.type)>=0; }
function prettyTime(t){
  if(!t) return '';
  var p=String(t).split(':'), h=parseInt(p[0],10); if(isNaN(h)) return '';
  var ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+(p[1]||'00')+' '+ap;
}
// Every booked, not-yet-completed appointment across the active jobs, as
// {lead, appt} pairs — the field app's real unit of work is a VISIT, not a job.
function apptEntries(leads){
  var out=[];
  leads.forEach(function(l){
    apptsOf(l).forEach(function(a){
      if(a && a.date && !a.completedAt) out.push({l:l,a:a});
    });
  });
  return out.sort(function(x,y){
    return (x.a.date+(x.a.time||'')).localeCompare(y.a.date+(y.a.time||''));
  });
}
function isDirect(l){ return !PLATFORMS.includes(l.source); }
function activeLeads(){ return getLeads().filter(l=>l && !['archived','closed-won','closed-lost','not-won'].includes(l.stage) && !(l.lostInfo&&l.lostInfo.isLost)); }
function getQuotes(){ try{return JSON.parse(localStorage.getItem('gk_quotes')||'[]')}catch(e){return[]} }
function fmt$(n){ return '$'+Number(n||0).toLocaleString('en-US'); }
// The quote amount as originally priced: card = quoteTotal (w/ fee), net = preProcessingTotal. Falls back to jobValue.
function quoteAmounts(l){
  const q = l.acceptedQuoteId ? getQuotes().find(x=>x.id===l.acceptedQuoteId) : null;
  if(q){ const net=(typeof q.preProcessingTotal==='number'&&isFinite(q.preProcessingTotal))?Math.round(q.preProcessingTotal):null;
         const card=(typeof q.quoteTotal==='number'&&isFinite(q.quoteTotal))?Math.round(q.quoteTotal):net; return {net,card}; }
  const jv=(l.jobValue&&typeof l.jobValue.amount==='number'&&isFinite(l.jobValue.amount))?Math.round(l.jobValue.amount):null;
  return {net:jv, card:jv};
}
// ── Install Spec ──────────────────────────────────────────────────────────
// Assembled from data the office ALREADY maintains — there are no new fields to
// fill in anywhere. Panel + service come from the job's Electrical Snapshot;
// breaker amps, wire gauge/metal, tandem count and run length come from the
// accepted quote's Quick Quote. Mirrors index.html's EVNEMA_WIRE_OPTIONS (amps
// are only stated for the two standard wires — we show a breaker size only when
// it's actually known rather than guessing on the long-run variants).
const EV_WIRE_SPEC = {
  '8cu': { wire:'#8 Cu', amps:'50 A' },
  '6cu': { wire:'#6 Cu', amps:'60 A' },
  '4cu': { wire:'#4 Cu', amps:'' },
  '2al': { wire:'#2 Al', amps:'' }
};
const RUN_LABEL = { crawl:'crawl space', attic:'attic', unfinished:'unfinished space',
  surface:'surface conduit', 'hand-trench':'trench (hand dug)', 'machine-trench':'trench (machine)' };
function _installSpecRows(l){
  const rows=[]; if(!l) return rows;
  const s=l.electricalSnapshot||{};
  const panel = s.panelBrand==='Other' ? (s.panelBrandOther||'Other') : (s.panelBrand||'');
  if(panel)        rows.push(['Panel', panel]);
  if(s.serviceSize) rows.push(['Service', s.serviceSize]);
  // Breaker: the Electrical Snapshot is authoritative when it's filled in; the
  // quote's wire choice is only a fallback (it implies amps for the two standard
  // wires). Shows "— not recorded —" when neither is known, so the tech can see
  // the gap rather than silently getting no breaker line at all.
  const bkr = s.breakerSize==='Other' ? (s.breakerSizeOther||'') : (s.breakerSize||'');
  const q = l.acceptedQuoteId ? getQuotes().find(x=>x.id===l.acceptedQuoteId) : null;
  const qq = q && q.qq ? q.qq : null;
  const w = qq ? EV_WIRE_SPEC[qq.evWireId||'6cu'] : null;
  if(bkr)                 rows.push(['Breaker', bkr]);
  else if(w && w.amps)    rows.push(['Breaker', w.amps+' 2-pole (from quote)']);
  else if(panel||qq)      rows.push(['Breaker', '— not recorded —']);
  if(qq){
    if(w) rows.push(['Wire', w.wire]);
    if(typeof qq.tandemBreakers==='number')
      rows.push(['Tandems', qq.tandemBreakers>0 ? (qq.tandemBreakers+' needed') : 'None']);
    const segs = Array.isArray(qq.runSegs)?qq.runSegs:[];
    if(segs.length){
      const total = segs.reduce((n,sg)=>n+(parseInt(sg.ft)||0),0);
      const routes = [...new Set(segs.map(sg=>RUN_LABEL[sg.type]||sg.type))].filter(Boolean).join(', ');
      if(total) rows.push(['Run', total+' ft'+(routes?(' — '+routes):'')]);
    }
  }
  // Carry the BRH rule all the way to the person actually holding the breaker —
  // the mistake happens at the supply house or in the truck, not at the desk.
  if(/Eaton BR/i.test(panel||'') && /60-amp/i.test(bkr||''))
    rows.push(['⚠ Breaker', 'Use BRH260 — BR260 not used on EV loads']);
  // If the office scheduled without the spec, show WHY so the tech isn't guessing.
  if(l.specSkip && l.specSkip.why) rows.push(['⚠ Spec', l.specSkip.why]);
  return rows;
}

// Amount to actually COLLECT. If the tech made an on-site adjustment, that single
// figure is what we charge on every method; otherwise fall back to the quote.
// ── Deposits / money already paid (field-20) ─────────────────────────────
// Jon, 2026-08-14, morning of the Cohler install: "He paid a $500 deposit
// towards his $2495 total but the field app still shows him owning the full
// amount." The CRM had no notion of money already collected. calcDepositSchedule()
// only PRINTS a schedule on the quote and drives the QuickBooks invoice; the job's
// `payment` is a single overwritable slot, not a ledger. So the tech was one tap
// away from asking a customer for $500 he had already paid.
//
// SELECTABLE BY DESIGN — Jon: "not everyone pays the up front fee." This reads
// `lead.priorPayments`, which exists ONLY when someone records a credit. A job
// with no deposit has no array, priorPaid() returns 0, and every amount in this
// app is identical to field-19. Nothing is inferred from the deposit TIERS,
// because a scheduled deposit and a paid one are not the same thing.
function priorPayments(l){ return (l && Array.isArray(l.priorPayments)) ? l.priorPayments : []; }
// ⚠ 2026-08-25 (field-26) — MONEY THE OFFICE RECORDED WAS INVISIBLE HERE.
// The CRM counts BOTH stores (`_pcPaidTotal` = ledger + field deposits), but
// this app counted only `priorPayments[]`. So a deposit Sherri recorded on the
// Payments page did not come off the tech's "Amount to collect" — he would have
// asked the customer for the full price on a job already part-paid.
// `ledgerPayments()` is the other half; `allPaid()` is what every number on
// this screen now nets against. Same arithmetic as the CRM, deliberately.
function ledgerPayments(l){ return (l && Array.isArray(l.payments)) ? l.payments : []; }
function _sumAmts(list){
  return list.reduce(function(sum,p){
    const a = p && Number(p.amount);
    return sum + ((isFinite(a) && a>0) ? Math.round(a) : 0);
  },0);
}
function priorPaid(l){ return _sumAmts(priorPayments(l)); }
function ledgerPaid(l){ return _sumAmts(ledgerPayments(l)); }
function allPaid(l){ return priorPaid(l) + ledgerPaid(l); }
// Everything already paid, newest last, as ONE list the tech can read —
// office deposits and field collections together. Jon, 2026-08-25: "it may
// benefit them to know what the original total was and that the customer paid
// a deposit, since the customer will likely tell them they did."
function allPaymentsList(l){
  var out = [];
  priorPayments(l).forEach(function(p){
    if(!p) return;
    out.push({ id:p.id||'', amount:Number(p.amount)||0, method:p.method||'deposit',
               at:p.at||p.collectedAt||'', note:p.note||'', kind:'deposit', prior:true });
  });
  ledgerPayments(l).forEach(function(p){
    if(!p) return;
    out.push({ id:p.id||'', amount:Number(p.amount)||0, method:p.method||'',
               at:p.collectedAt||'', note:p.note||'', kind:p.kind||'', prior:false });
  });
  return out.filter(function(p){ return p.amount > 0; })
            .sort(function(a,b){ return String(a.at||'').localeCompare(String(b.at||'')); });
}
function payKindLabel(p){
  if(!p) return 'Payment';
  if(p.kind === 'deposit') return 'Deposit';
  if(p.kind === 'balance') return 'Balance';
  if(p.kind === 'partial') return 'Partial payment';
  return p.prior ? 'Deposit' : 'Payment';
}
// Everything that quotes a number to a customer or charges a card goes through
// here — the amount card, the Collect Payment buttons, Tap to Pay and the texted
// pay link — so netting the deposit out HERE fixes all of them at once and none
// can drift. A deposit is a flat dollar credit, so it comes off the card and the
// cash/Zelle figure equally, which leaves the card buffer intact on the balance.
function jobPayAmounts(l){
  let base;
  if(l && l.priceOverride && typeof l.priceOverride.amount==='number' && isFinite(l.priceOverride.amount)){
    const a=Math.round(l.priceOverride.amount); base={net:a, card:a, overridden:true};
  } else { base=quoteAmounts(l); }
  // field-26: nets EVERY recorded payment, not just field deposits.
  const paid=allPaid(l);
  if(!paid) return {net:base.net, card:base.card, overridden:!!base.overridden, base:base, paid:0};
  const cut=v=>(v==null?null:Math.max(0, v-paid));
  return {net:cut(base.net), card:cut(base.card), overridden:!!base.overridden, base:base, paid:paid};
}
// Is this job actually settled? field-26: the payment card used to read
// `if (l.payment)`, i.e. "any payment at all exists" — so the first office
// deposit flipped a job to "✓ Collected" and REMOVED the Collect Payment,
// Tap to Pay and pay-link buttons, leaving the tech no way to take the balance
// and a screen telling him not to. Settled now means the balance is really 0.
// ⚠ field-27 (2026-08-25) — jobs the office settled BEFORE the payment ledger
// existed carry `invoiced.done` and no payments[] rows at all. In the CRM that
// put them on the chase list; here it is worse — allPaid() reads $0, so this
// returns false and the tech is shown a Collect Payment button for money the
// customer already handed over. Same gate as the CRM's _pcSettledByHand: only
// when NOTHING is recorded, so a real deposit still leaves the balance visible.
function officeSettled(l){
  return !!(l && l.invoiced && l.invoiced.done && allPaid(l) === 0);
}
function jobFullyPaid(l){
  if(!l) return false;
  if(officeSettled(l)) return true;
  const amt = jobPayAmounts(l);
  const owed = (amt.net!=null ? amt.net : amt.card);
  if(owed == null) return !!(l.payment && l.payment.collectedAt);  // no computable total → old behaviour
  return owed <= 0 && allPaid(l) > 0;
}

async function loadMsal(){ const m = await import('https://esm.sh/@azure/msal-browser@2'); window.msal = m; return m; }
async function initAuth(){

    cache:{ cacheLocation:'localStorage', storeAuthStateInCookie:false }
  });
  let resp=null; try{ resp = await _msal.handleRedirectPromise(); }catch(e){ console.warn('[field] redirect promise', e); }
  let account = (resp&&resp.account) || (_msal.getAllAccounts()[0]) || null;
  if(account) _msal.setActiveAccount(account);

}
async function getTokenSilent(){
  const a=_msal.getAllAccounts()[0]; if(!a) return null;
  try{ const tr=await _msal.acquireTokenSilent({account:a,scopes:GRAPH_SCOPES}); _gToken=tr.accessToken; return _gToken; }
  catch(e){ console.warn('[field] silent token failed', e); return null; }
}
function signIn(){ _msal.loginRedirect({scopes:GRAPH_SCOPES}); }
function signOut(){ try{ localStorage.removeItem('gk_session'); }catch(e){} _msal.logoutRedirect({postLogoutRedirectUri:AUTH_REDIRECT}); }

// ---------- graph + sharepoint read ----------
async function graphFetch(path){
  const url = path.startsWith('https://') ? path : 'https://graph.microsoft.com/v1.0'+path;
  const go = ()=>fetch(url,{headers:{Authorization:'Bearer '+_gToken}});
  let r=await go();
  if(r.status===401){ const a=_msal.getAllAccounts()[0]; if(a){ try{ const tr=await _msal.acquireTokenSilent({account:a,scopes:GRAPH_SCOPES,forceRefresh:true}); _gToken=tr.accessToken; r=await go(); }catch(e){} } }
  if(!r.ok) throw new Error('Graph '+r.status);
  return r.json();
}
async function spInit(){
  if(_spSite) return;
  const site = await graphFetch('/sites/'+SP_HOSTNAME); _spSite=site.id;
  const lists = await graphFetch('/sites/'+_spSite+'/lists?$select=id,name,displayName&$top=100');
  const l = (lists.value||[]).find(x=>x.displayName===SP_LIST_NAME||x.name===SP_LIST_NAME);
  _spList = l?l.id:null;
  try{ const dr = await graphFetch('/sites/'+_spSite+'/drive'); _spDrive = dr.id; }catch(e){ console.warn('[field] drive', e); }
}
async function syncFromSP(){
  if(!_spList) throw new Error('CRM data list not found');
  let next='/sites/'+_spSite+'/lists/'+_spList+'/items?$expand=fields&$top=200'; const got={};
  while(next){ const res=await graphFetch(next); for(const it of (res.value||[])){ const k=it.fields&&it.fields.Title, v=it.fields&&it.fields.DataValue; if(k&&v) got[k]=v; } next=res['@odata.nextLink']||null; }
  // Read-only: overwrite the keys this tool needs.
  // field-24: gk_ahjs + gk_inspectors added. These were ALREADY arriving in the
  // bulk read above (both are in the CRM's SYNC_KEYS, so they are rows in the
  // same SharePoint list this loop already walks) — they were simply thrown away
  // instead of persisted. Adding them costs ZERO extra network calls.
  ['gk_leads','gk_customers','gk_quotes','gk_ahjs','gk_inspectors'].forEach(k=>{ if(got[k]) localStorage.setItem(k,got[k]); });
}
// field-19 — WHICH PHOTOS A TECH MAY DELETE.
// Only files the field app itself uploaded, which are named "<shot>__<epoch>_<name>"
// (see _photoPrep). That deliberately excludes the two other things living in
// these same folders: pictures the CUSTOMER texted in (filed by the worker into
// site/ as "Text photo <stamp>.jpg") and anything the office put there by hand.
// A tech deleting his own blurry panel shot is the ask; a tech deleting the
// customer's own evidence is not. ⚠ `site` is not a synonym for "our photos".
function _fieldOwned(name){ return /^[A-Za-z0-9-]+__\d{10,}_/.test(String(name||'')); }

// field-15: ask Graph for THUMBNAILS alongside the children. The grid shows the
// small rendition (KB, not MB — the old grid pulled every full-size original
// just to draw a 96px square); the lightbox uses the full downloadUrl.
async function loadJobPhotos(jobId){
  if(!_spDrive) return [];
  let cats=[]; try{ const c=await graphFetch('/drives/'+_spDrive+'/root:/'+encodeURI(SP_PHOTO_LIB+'/'+jobId)+':/children'); cats=c.value||[]; }
  catch(e){ return []; }
  const out=[];
  for(const cat of cats){ if(!cat.folder) continue;
    try{ const f=await graphFetch('/drives/'+_spDrive+'/items/'+cat.id+'/children?$expand=thumbnails');
      for(const it of (f.value||[])){ if(it.file && /^image\//.test(it.file.mimeType||'') && it['@microsoft.graph.downloadUrl']){
        const t=(it.thumbnails&&it.thumbnails[0])||{};
        out.push({id:it.id, job:jobId, name:it.name, cat:cat.name, own:_fieldOwned(it.name),
          thumb:(t.large&&t.large.url)||(t.medium&&t.medium.url)||it['@microsoft.graph.downloadUrl'],
          full:it['@microsoft.graph.downloadUrl'],
          // kept for anything still reading .url
          url:it['@microsoft.graph.downloadUrl']});
      } }
    }catch(e){}
  }
  return out;
}

// One renderer for every screen that draws the grid (walkdown, job detail, and
// both post-upload refreshes). Four hand-copies of this line existed before
// field-19; the 2026-08-08 date bug was that exact shape — one fix applied to
// three of four copies. Deleting a photo has to repaint all of them.
function _photoGridHtml(ph){
  if(!ph || !ph.length) return '<div class="muted" style="font-size:13px">No photos yet.</div>';
  return '<div class="pgrid">'+ph.map((p,i)=>'<div class="pcell'+(p.queued?' q':'')+'" onclick="openLightbox('+i+')"><img src="'+esc(p.thumb||p.full)+'" loading="lazy" decoding="async" alt="">'+(p.queued?'<span class="pq">\ud83d\udcf1</span>':'')+'</div>').join('')+'</div>';
}
async function _photoGridRefresh(jobId){
  const el=document.getElementById('photos');
  if(el) el.innerHTML='<div class="muted" style="font-size:13px">Refreshing\u2026</div>';
  try{ const ph=await loadJobPhotos(jobId); _ph=_photosPlusQueue(ph,jobId); _applyShotStatus(_ph); if(el) el.innerHTML=_photoGridHtml(_ph); _pqPaint(jobId); }
  catch(e){ if(el) el.innerHTML='<div class="muted" style="font-size:13px">Couldn\u2019t load photos.</div>'; }
}

// ---------- photo lightbox (field-15) ----------
// Photos open INSIDE the app. The old grid linked target="_blank" to the raw
// SharePoint downloadUrl — a Content-Disposition:attachment link that iOS
// standalone apps render as a dead white overlay (Jonathan, 2026-08-04: nothing
// had opened for two days, WiFi or LTE). No new tab, no re-download: the
// lightbox reuses the URL the grid already loaded.
let _ph = [];      // photos of the currently open job (set by the render callbacks)
let _lbIdx = 0;
function openLightbox(i){
  closeLightbox();
  if(!_ph[i]) return;
  const d=document.createElement('div'); d.className='lb'; d.id='lb';
  d.innerHTML = '<img id="lb-img" alt="">'
    + '<div class="lbx" onclick="closeLightbox()">✕</div>'
    + '<div class="lbdel" id="lb-del" style="display:none" onclick="event.stopPropagation();deletePhoto()">🗑 Delete</div>'
    + (_ph.length>1
        ? '<div class="lbnav" style="left:8px"  onclick="event.stopPropagation();stepLightbox(-1)">‹</div>'
        + '<div class="lbnav" style="right:8px" onclick="event.stopPropagation();stepLightbox(1)">›</div>'
        : '')
    + '<div class="lbcap" id="lb-cap"></div>';
  // Backdrop click closes (desktop / non-touch). Taps ON the image are handled
  // by the touch logic below so single-tap-close and double-tap-zoom coexist.
  d.onclick=function(e){ if(e.target===d) closeLightbox(); };
  _lbGestures(d);
  document.body.appendChild(d);
  _lbShow(i);
}

// ── Pinch zoom / pan / double-tap (field-16, Jonathan 2026-08-04: "phone
// screens are small so to read breakers takes some zooming in"). The app
// globally locks touch-action to pan-only, so the lightbox owns its own
// gestures: pinch 1–6× anchored at the pinch point, one-finger pan while
// zoomed, double-tap toggles 3×/1×, swipe steps photos when not zoomed,
// single tap on the photo closes (after the double-tap grace window).
let _lbS=1,_lbTx=0,_lbTy=0;
function _lbApply(){ const i=document.getElementById('lb-img'); if(i) i.style.transform='translate('+_lbTx+'px,'+_lbTy+'px) scale('+_lbS+')'; }
function _lbResetZoom(){ _lbS=1;_lbTx=0;_lbTy=0;_lbApply(); }
function _lbZoomAt(px,py,s2){       // px,py relative to screen centre
  const s1=_lbS; s2=Math.max(1,Math.min(6,s2));
  _lbTx = px-(px-_lbTx)*(s2/s1);
  _lbTy = py-(py-_lbTy)*(s2/s1);
  _lbS=s2; if(_lbS<=1){_lbS=1;_lbTx=0;_lbTy=0;}
  _lbApply();
}
function _lbGestures(d){
  let prevD=0, prevMid=null, panFrom=null, tFrom=null, moved=false, lastTap=0, tapTimer=null;
  const mid=t=>({x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2});
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const rel=p=>{ const r=d.getBoundingClientRect(); return {x:p.x-(r.left+r.width/2), y:p.y-(r.top+r.height/2)}; };
  d.addEventListener('touchstart',function(e){
    if(e.target.closest('.lbnav,.lbx,.lbdel')) return;      // buttons keep their own taps
    if(e.touches.length===2){ prevD=dist(e.touches); prevMid=mid(e.touches); moved=true; clearTimeout(tapTimer); }
    else if(e.touches.length===1){ panFrom={x:e.touches[0].clientX,y:e.touches[0].clientY,tx:_lbTx,ty:_lbTy}; tFrom=panFrom; moved=false; }
  },{passive:false});
  d.addEventListener('touchmove',function(e){
    if(e.target.closest('.lbnav,.lbx,.lbdel')) return;
    e.preventDefault();
    if(e.touches.length===2 && prevD){
      const dNow=dist(e.touches), mNow=mid(e.touches), m=rel(mNow);
      _lbZoomAt(m.x, m.y, _lbS*(dNow/prevD));
      if(prevMid){ _lbTx+=mNow.x-prevMid.x; _lbTy+=mNow.y-prevMid.y; _lbApply(); }
      prevD=dNow; prevMid=mNow;
    } else if(e.touches.length===1 && panFrom){
      const dx=e.touches[0].clientX-panFrom.x, dy=e.touches[0].clientY-panFrom.y;
      if(Math.abs(dx)>6||Math.abs(dy)>6) moved=true;
      if(_lbS>1){ _lbTx=panFrom.tx+dx; _lbTy=panFrom.ty+dy; _lbApply(); }
    }
  },{passive:false});
  d.addEventListener('touchend',function(e){
    if(e.target.closest('.lbnav,.lbx,.lbdel')) return;
    if(e.touches.length>0){ prevD=0; prevMid=null; return; }   // one finger of a pinch lifted
    if(prevD){ prevD=0; prevMid=null; return; }                 // pinch just ended
    if(!tFrom) return;
    const endX=e.changedTouches[0].clientX, endY=e.changedTouches[0].clientY;
    const dx=endX-tFrom.x, dy=endY-tFrom.y;
    if(moved){
      if(_lbS===1 && Math.abs(dx)>60 && Math.abs(dy)<50 && _ph.length>1){ _lbResetZoom(); stepLightbox(dx<0?1:-1); }
      panFrom=null; return;
    }
    const now=Date.now();
    if(now-lastTap<300){                                        // double-tap
      clearTimeout(tapTimer); lastTap=0;
      if(_lbS>1) _lbResetZoom();
      else { const m=rel({x:endX,y:endY}); _lbZoomAt(m.x,m.y,3); }
    } else {
      lastTap=now;
      clearTimeout(tapTimer);
      tapTimer=setTimeout(function(){ closeLightbox(); },280);  // clean single tap = close
    }
    panFrom=null;
  },{passive:false});
}
function _lbShow(i){
  _lbIdx=(i+_ph.length)%_ph.length;
  const p=_ph[_lbIdx], img=document.getElementById('lb-img'), cap=document.getElementById('lb-cap');
  if(!img||!p) return;
  img.onerror=function(){ if(cap) cap.textContent='Could not load this photo — the link has gone stale. Close this and tap ↻ to refresh the job.'; };
  img.src=p.full||p.thumb||'';
  // Delete: only on the app's own uploads (see _fieldOwned()). A QUEUED photo
  // (field-21, still on the phone) gets "Remove" instead — off the queue, and
  // gone for good since it never reached SharePoint.
  const del=document.getElementById('lb-del');
  if(del){ del.style.display = (p.own||p.queued) ? 'block' : 'none'; del.textContent = p.queued ? '🗑 Remove' : '🗑 Delete'; }
  if(cap) cap.textContent=(_ph.length>1?(_lbIdx+1)+' / '+_ph.length+' · ':'')+(p.cat?p.cat+' · ':'')+(p.name||'')+(p.queued?' · 📱 on this phone, not uploaded yet':'');
}
// field-19 (Jon, 2026-08-13: "technicians need to be able to delete pics that
// they add in error"). Deletes the photo you are LOOKING AT — a bad shot is only
// obvious full-screen, and picking the wrong 96px thumbnail is exactly the
// mistake this is meant to undo. Graph DELETE on a driveItem sends it to the
// SITE RECYCLE BIN (93 days), so a wrong tap is recoverable by the office; it is
// not a shredder. 404 counts as success — the file is gone either way, and a
// double-tap must not raise an error at someone standing on a roof.
async function deletePhoto(){
  const p=_ph[_lbIdx];
  if(!p) return;
  if(p.queued){
    // field-21: still on the phone, never uploaded. Removing it means it is
    // gone for good \u2014 there is no recycle bin for a photo that never left.
    if(!confirm('Remove this photo?\n\nIt has NOT been uploaded yet \u2014 removing it means it\u2019s gone for good.')) return;
    await _pqRemove(p.qid);
    _ph.splice(_lbIdx,1);
    closeLightbox();
    const el=document.getElementById('photos'); if(el) el.innerHTML=_photoGridHtml(_ph);
    _applyShotStatus(_ph); _pqPaint(p.job);
    return;
  }
  if(!p.id || !_spDrive){ alert('This photo can\u2019t be deleted from the app \u2014 ask the office.'); return; }
  if(!p.own){ alert('This one wasn\u2019t taken in the field app \u2014 it may be a photo the customer texted in. Ask the office to remove it.'); return; }
  if(!confirm('Delete this photo?\n\n'+(p.name||'')+'\n\nIt comes off the job. The office can still recover it from the SharePoint recycle bin.')) return;
  const btn=document.getElementById('lb-del');
  if(btn) btn.textContent='Deleting\u2026';
  try{
    try{ await getTokenSilent(); }catch(e){}
    const r=await fetch('https://graph.microsoft.com/v1.0/drives/'+_spDrive+'/items/'+p.id,
      { method:'DELETE', headers:{ Authorization:'Bearer '+_gToken } });
    if(!r.ok && r.status!==404) throw new Error('DELETE '+r.status);
  }catch(e){
    console.warn('[field] delete', e);
    if(btn) btn.textContent='🗑 Delete';
    alert('Could not delete that photo: '+((e&&e.message)||e));
    return;
  }
  const jobId=p.job;
  closeLightbox();
  const st=document.getElementById('ph-status'); if(st) st.textContent='Photo deleted.';
  if(jobId) await _photoGridRefresh(jobId);   // repaints the grid AND re-ticks the shot checklist
}
function stepLightbox(d){ _lbResetZoom(); _lbShow(_lbIdx+d); }
function closeLightbox(){ const d=document.getElementById('lb'); if(d) d.remove(); _lbS=1;_lbTx=0;_lbTy=0; }

// ---------- field-21: OFFLINE PHOTO QUEUE ----------
// Cohler + Silva installs, 2026-08-14: two dead-zone jobs. Photos went
// camera → memory → upload, and a failed upload THREW THE PICTURE AWAY (the
// only trace was a 12px "1 failed" status line). Silva's install photos ended
// the day existing nowhere. So: every photo is now written to the app's own
// on-phone store (IndexedDB — private to this app; NEVER the camera roll,
// which is the point: job photos stay off the techs' personal phones) the
// moment it is taken, and it only leaves the phone after SharePoint confirms
// the upload. The shot checklist counts CAPTURED photos (📱 on phone /
// ✓ uploaded), so a tech can verify he has everything BEFORE driving out of a
// dead zone; the queue drains itself when signal returns (the 'online' event,
// foregrounding the app, a 45-second timer, and after every new capture).
const PQ_DB='gk_field_photoq';
let _pqDb=null, _pqCache=[], _pqUrls={}, _pqBusy=false, _pqTimer=null;
function _pqOpen(){
  if(_pqDb) return Promise.resolve(_pqDb);
  if(typeof indexedDB==='undefined') return Promise.reject(new Error('no idb'));
  return new Promise(function(res,rej){
    const r=indexedDB.open(PQ_DB,1);
    r.onupgradeneeded=function(){ try{ r.result.createObjectStore('photos',{keyPath:'qid'}); }catch(e){} };
    r.onsuccess=function(){ _pqDb=r.result; res(_pqDb); };
    r.onerror=function(){ rej(r.error||new Error('idb open failed')); };
  });
}
function _pqTx(mode,fn){
  return _pqOpen().then(function(db){ return new Promise(function(res,rej){
    const tx=db.transaction('photos',mode), req=fn(tx.objectStore('photos'));
    tx.oncomplete=function(){ res(req?req.result:undefined); };
    tx.onerror=function(){ rej(tx.error||new Error('idb tx')); };
    tx.onabort =function(){ rej(tx.error||new Error('idb abort')); };
  }); });
}
async function _pqLoad(){
  try{ const rows=await _pqTx('readonly',function(st){ return st.getAll(); });
    _pqCache=(rows||[]).sort(function(a,b){ return String(a.at).localeCompare(String(b.at)); });
  }catch(e){ console.warn('[field] queue load',e); }
}
async function _pqAdd(rec){ await _pqTx('readwrite',function(st){ return st.put(rec); }); _pqCache.push(rec); }
async function _pqStamp(rec){ try{ await _pqTx('readwrite',function(st){ return st.put(rec); }); }catch(e){} }
async function _pqRemove(qid){
  try{ await _pqTx('readwrite',function(st){ return st.delete(qid); }); }catch(e){}
  _pqCache=_pqCache.filter(function(r){ return r.qid!==qid; });
  if(_pqUrls[qid]){ try{ URL.revokeObjectURL(_pqUrls[qid]); }catch(e){} delete _pqUrls[qid]; }
}
function _pqForJob(job){ return _pqCache.filter(function(r){ return r.job===job; }); }
function _pqUrl(rec){
  if(!_pqUrls[rec.qid]){ try{ _pqUrls[rec.qid]=URL.createObjectURL(rec.blob); }catch(e){ return ''; } }
  return _pqUrls[rec.qid];
}
// A queue record dressed as a photo, so the grid / lightbox / shot checklist
// treat it exactly like an uploaded one. own:false — no SharePoint delete to
// offer; the lightbox offers "Remove" (off the queue) instead via p.queued.
function _pqEntry(rec){ const u=_pqUrl(rec); return {queued:1, qid:rec.qid, job:rec.job, name:rec.fname, cat:rec.folder, own:false, thumb:u, full:u, url:u}; }
function _photosPlusQueue(ph, job){ return (ph||[]).concat(_pqForJob(job).map(_pqEntry)); }
function _pqOpenJob(){ const m=/#job=([^&]+)/.exec(location.hash); return m?decodeURIComponent(m[1]):''; }
// The Graph PUT, from a stored record. 90s abort: a dead-zone fetch can hang
// for many minutes holding the whole queue; better to cut it and let the
// retry timer have another go.
async function _pqUpload(rec){
  if(!_spDrive) throw new Error('no drive');
  const path=SP_PHOTO_LIB+'/'+rec.job+'/'+rec.folder+'/'+rec.fname;
  const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  const tm=ctl?setTimeout(function(){ try{ ctl.abort(); }catch(e){} },90000):null;
  try{
    const r=await fetch('https://graph.microsoft.com/v1.0/drives/'+_spDrive+'/root:/'+encodeURI(path)+':/content',
      { method:'PUT', headers:{ Authorization:'Bearer '+_gToken, 'Content-Type':rec.type||'image/jpeg' }, body:rec.blob, signal:ctl?ctl.signal:undefined });
    if(!r.ok) throw new Error('upload '+r.status);
  } finally { if(tm) clearTimeout(tm); }
}
// Flip an on-screen tile from "queued" to "uploaded" without a Graph round
// trip — the object URL keeps rendering; own stays false until a real refresh
// hydrates the driveItem id (delete needs that id anyway).
function _pqMarkUploaded(rec){ for(const p of _ph){ if(p && p.qid===rec.qid) p.queued=0; } }
async function _pqDrain(){
  if(_pqBusy || !_pqCache.length) return;
  _pqBusy=true;
  const uploadedJobs={};
  try{
    // Signed in but the boot sync never ran (offline boot) — get the drive now.
    if(!_spDrive){ try{ await spInit(); }catch(e){} }
    if(!_spDrive && _spSite){ try{ const dr=await graphFetch('/sites/'+_spSite+'/drive'); _spDrive=dr.id; }catch(e){} }
    let spins=0;
    while(_pqCache.length && spins<_pqCache.length+8){
      spins++;
      const rec=_pqCache[0];
      try{ await getTokenSilent(); }catch(e){}
      try{
        await _pqUpload(rec);
        await _pqRemove(rec.qid);
        uploadedJobs[rec.job]=1;
        if(rec.job===_pqOpenJob()){ _pqMarkUploaded(rec); _applyShotStatus(_ph); }
      }catch(e){
        rec.tries=(rec.tries||0)+1; rec.lastErr=String((e&&e.message)||e);
        await _pqStamp(rec);
        // An HTTP 4xx means THIS file was refused, not that the network is
        // down — rotate it to the back so one poisoned photo can't dam the
        // queue. Anything else is signal-shaped: stop and let the timer retry.
        if(/^upload 4/.test(rec.lastErr) && _pqCache.length>1){ _pqCache.push(_pqCache.shift()); continue; }
        break;
      }
    }
  } finally {
    _pqBusy=false;
    _pqSchedule();
    const open=_pqOpenJob();
    _pqPaint(open);
    // Queue for the open job just emptied → one real refresh so tiles gain
    // their driveItem ids (and the delete button).
    if(open && uploadedJobs[open] && !_pqForJob(open).length){ try{ _photoGridRefresh(open); }catch(e){} }
  }
}

// Jon, 8/19: on inspection days the crew needs the AHJ's inspection office and
// that AHJ's inspectors reachable from the job page — "so regardless of who ends
// up getting the assignment, we can reach them."
//
// CALL ONLY in this cut, deliberately. Every button below is a plain `tel:` href:
// no fetch, no auth token, no worker round-trip, no new storage, nothing to
// drain a battery or stall on bad signal — the app stays as light as it was.
// 💬 Texting an inspector goes in field-25, AFTER the 8/20 phone port, so no
// inspector thread is opened on a number that is about to move.
//
// The data is already here: gk_ahjs + gk_inspectors ride the syncFromSP() bulk
// read (see above). Mirrors the CRM's getAHJs()/getInspectors()/inspectorsForAHJ().
const AHJ_KEY_F = 'gk_ahjs', INSPECTORS_KEY_F = 'gk_inspectors';
function getAHJs(){
  try{ const a=JSON.parse(localStorage.getItem(AHJ_KEY_F)||'[]'); return Array.isArray(a)?a.filter(x=>x&&!x.deleted):[]; }
  catch(e){ return []; }
}
function getInspectors(){
  try{ const a=JSON.parse(localStorage.getItem(INSPECTORS_KEY_F)||'[]'); return Array.isArray(a)?a.filter(x=>x&&!x.deleted):[]; }
  catch(e){ return []; }
}
function inspectorsForAHJ(ahjId){ return getInspectors().filter(i=>i.ahjId===ahjId); }

// Jurisdiction, in the CRM's order of truth (getLeadJurisdiction in index.html):
// a human's answer wins, then the geocoded county, then the legacy value, and
// only then the mailing city — which is the one that used to send Sherri to the
// City of Richmond portal for a Chesterfield house.
function _jurisOf(l){
  if(!l) return '';
  return String(l.jurisdictionManual || l.jurisdictionDerived || l.jurisdiction || l.siteCity || '').trim();
}
// Matches the CRM's textInspectorForJob() rule, with one guard it lacks: an AHJ
// whose name reduces to nothing (or to a 1-2 char stub) after stripping
// " county"/" city" must NOT match every job by way of ''.includes.
function ahjForLead(l){
  const j=_jurisOf(l).toLowerCase(); if(!j) return null;
  const ahjs=getAHJs();
  for(let k=0;k<ahjs.length;k++){
    const a=ahjs[k], an=String(a.name||'').toLowerCase().trim(); if(!an) continue;
    if(an.indexOf(j)>=0) return a;
    const stub=an.replace(/ county| city/g,'').trim();
    if(stub.length>=3 && j.indexOf(stub)>=0) return a;
  }
  return null;
}
// Is this job an inspection job? Either the office recorded an inspection on it,
// or there is an inspection appointment on the calendar.
function _hasInspContext(l){
  if(!l) return false;
  const st = l.inspection && l.inspection.status;
  if(st && String(st).toLowerCase()!=='none') return true;
  return apptsOf(l).some(a=>a && a.type==='inspection');
}

function _dataUrlToBlob(d){ const a=d.split(','),m=a[0].match(/:(.*?);/)[1],b=atob(a[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return new Blob([u],{type:m}); }
async function resizeImage(file, maxDim, quality){
  const dataUrl = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); });
  if(!/^image\//.test(file.type||'')) return { blob:_dataUrlToBlob(dataUrl), name:file.name||'file', type:file.type||'application/octet-stream' };
  return await new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{ try{ let w=img.width,h=img.height; if(!w||!h) return reject(new Error('decode 0x0'));
      if(w>maxDim||h>maxDim){ if(w>h){ h=Math.round(h/w*maxDim); w=maxDim; } else { w=Math.round(w/h*maxDim); h=maxDim; } }
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>{ if(!b) return reject(new Error('toBlob null')); resolve({ blob:b, name:(file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg', type:'image/jpeg' }); },'image/jpeg',quality);
    }catch(e){ reject(e); } };
    img.onerror=()=>reject(new Error('image decode failed')); img.src=dataUrl;
  });
}
async function graphPatch(path, bodyObj){
  const r=await fetch('https://graph.microsoft.com/v1.0'+path,{method:'PATCH',headers:{Authorization:'Bearer '+_gToken,'Content-Type':'application/json'},body:JSON.stringify(bodyObj)});
  if(!r.ok) throw new Error('PATCH '+r.status); return r.json().catch(()=>null);
}
// All non-walkdown photos land in the job's install/ folder (which the CRM
// already auto-pulls); the shot TYPE is tagged as a "<key>__" filename prefix
// so the checklist can tell which required shots are done without needing
// extra SharePoint folders.
// field-21: this PREPS the queue record (resize + name + folder). The actual
// Graph PUT lives in _pqUpload(), fed from the on-phone queue — see the
// OFFLINE PHOTO QUEUE block above.
async function _photoPrep(jobId, file, catKey){
  const conv = await resizeImage(file, 2048, 0.88);
  const tag = (catKey||'other').replace(/[^a-z0-9-]/gi,'');
  const fname = tag+'__'+Date.now()+'_'+(conv.name||'photo.jpg').replace(/[^A-Za-z0-9._-]/g,'_');
  // ⚠ 2026-08-08 — WALKDOWN SHOTS GO TO site/, EVERYTHING ELSE TO install/.
  // Every photo used to land in install/ regardless of which screen took it,
  // with the shot type encoded only in the filename prefix. The CRM reads the
  // category off the FOLDER, so Chase's Matt Baldwin walkdown (GK-2026-5537499,
  // 2026-08-05) showed up as seven install photos on a job that had not been
  // installed. The office also has an Operations mirror that copies install/
  // into "Completion pics" — so left alone, pre-quote walkdown pictures would
  // eventually be filed as completion evidence.
  const folder = (tag === 'walkdown') ? 'site' : 'install';    // CRM auto-pulls both folders
  return { qid:'q'+Date.now()+'_'+Math.random().toString(36).slice(2,8), job:jobId, folder:folder,
           fname:fname, type:conv.type||'image/jpeg', blob:conv.blob, at:new Date().toISOString(), tries:0 };
}

// field-21: a picked photo is SAVED TO THE PHONE FIRST (IndexedDB), then the
// queue drains in the background. Before this, the photo lived only in memory
// between the camera and the Graph PUT — on the 2026-08-14 dead-zone jobs a
// failed upload silently destroyed the picture. Saving is local and instant,
// so this loop can't strand a tech; the upload happens whenever signal allows.
async function onPhotoPick(input, jobId){
  const files=[...(input.files||[])]; input.value=''; const cat=_photoCat; _photoCat='other'; if(!files.length) return;
  const st=document.getElementById('ph-status');
  let saved=0, direct=0, lost=0;
  for(let i=0;i<files.length;i++){
    if(st) st.textContent='Saving '+(i+1)+' of '+files.length+'…';
    let rec=null;
    try{ rec=await _photoPrep(jobId,files[i],cat); }
    catch(e){ console.warn('[field] photo prep',e); lost++; continue; }
    try{ await _pqAdd(rec); saved++; }
    catch(e){
      // No IndexedDB (shouldn't happen in a home-screen app) — fall back to a
      // direct upload so the photo still has a chance right now.
      console.warn('[field] queue add',e);
      try{ try{ await getTokenSilent(); }catch(_e){} await _pqUpload(rec); direct++; }
      catch(e2){ console.warn('[field] photo',e2); lost++; }
    }
  }
  if(st) st.textContent = (saved+direct)+' saved'+(lost?(' · '+lost+' FAILED'):'');
  if(lost) alert(lost+' photo'+(lost>1?'s':'')+' could not be saved OR uploaded. Take '+(lost>1?'them':'it')+' again — with the phone camera if this keeps happening — so nothing is lost.');
  // Repaint from what we have locally — works with zero bars of signal.
  _ph=_ph.filter(function(p){ return !p.queued; }).concat(_pqForJob(jobId).map(_pqEntry));
  const el=document.getElementById('photos'); if(el) el.innerHTML=_photoGridHtml(_ph);
  _applyShotStatus(_ph);
  _pqPaint(jobId);
  if(direct){ try{ await _photoGridRefresh(jobId); }catch(e){} }
  _pqDrain();
}

// field-21: three states per shot — ✓ uploaded (green), 📱 captured but still
// on the phone (amber), ○ not taken. Both of the first two count toward
// "N of 7": the checklist answers "do I HAVE the shot?", which is what the
// tech needs to know before leaving a dead-zone job. The amber tells him the
// upload part isn't finished yet.

    const up=(photos||[]).some(p=>p && !p.queued && typeof p.name==='string' && p.name.indexOf(s.key+'__')===0);

    if(el){ el.textContent=up?'✓':(q?'📱':'○'); el.style.color=up?'#36c777':(q?'#e8b34a':'#5d6675'); } });

// Safe single-lead write: re-pull fresh, modify, merge by id+updatedAt, PATCH the list item.
async function pushLeads(){
  if(!_spList) throw new Error('no list');
  let itemId=null, spVal=null, next='/sites/'+_spSite+'/lists/'+_spList+'/items?$expand=fields&$top=200';
  while(next){ const res=await graphFetch(next); for(const it of (res.value||[])){ if(it.fields&&it.fields.Title==='gk_leads'){ itemId=it.id; spVal=it.fields.DataValue; } } next=res['@odata.nextLink']||null; }
  let merged=getLeads();
  if(spVal){ try{ const spArr=JSON.parse(spVal); const map=new Map(); for(const r of spArr) map.set(r.id,r);
    for(const r of getLeads()){ const ex=map.get(r.id); if(!ex || (r.updatedAt && (!ex.updatedAt || r.updatedAt>ex.updatedAt))) map.set(r.id,r); }
    merged=[...map.values()]; }catch(e){} }
  localStorage.setItem('gk_leads', JSON.stringify(merged));
  if(itemId) await graphPatch('/sites/'+_spSite+'/lists/'+_spList+'/items/'+itemId+'/fields', { DataValue: JSON.stringify(merged) });
}

  if(!arr[i].milestones) arr[i].milestones={};

  else { delete arr[i].milestones.installCompleted; }

}

}

// Completed, with a soft pre-flight checklist (never a hard block — the tech
// can always complete, but has to acknowledge what's missing).
async function doCompleteGated(jobId){
  const l=getLeads().find(x=>x.id===jobId); if(!l){ alert('Job not found'); return; }
  const missing=[];
  try{
    const ph=await loadJobPhotos(jobId);
    const miss=INSTALL_SHOTS.filter(s=>!_shotDone(ph,s.key)).length;
    if(miss>0) missing.push(miss+' of '+INSTALL_SHOTS.length+' required photos not taken');
  }catch(e){ missing.push('Could not verify required photos (no signal?)'); }
  if(isDirect(l) && !l.payment) missing.push('Payment not recorded (collect or text a pay link first)');
  if(!(l.milestones&&l.milestones.techArrived&&l.milestones.techArrived.done)) missing.push('\u201cI\u2019ve arrived\u201d was never tapped (completion will still record)');
  let msg;
  if(missing.length){
    msg='Before you complete this job:\n\n\u2022 '+missing.join('\n\u2022 ')
      +'\n\nIf the scope changed on site, use \u201cAdjust amount\u201d first so the office bills right.\n\nComplete anyway?';
  }else{
    msg='Everything checks out — photos done'+(isDirect(l)?', payment recorded':'')+'.\n\nMark this install complete? It moves the job to Post-Install for the office.';
  }
  if(!confirm(msg)) return;
  loading('Marking complete…');
  try{ await markComplete(jobId, true); }catch(e){ alert('Could not update: '+(e.message||e)); }
  renderDetail(jobId);
}

// Same worker + same thread the office CRM uses (/sms/thread keyed by leadId);
// sender attribution comes from the signed-in account server-side. Works on
// the current Twilio number and unchanged after the 770-2210 hosted-SMS flip.
let _fldSmsPoll=null;
function _stopFldSms(){ if(_fldSmsPoll){ clearInterval(_fldSmsPoll); _fldSmsPoll=null; } }
function toggleFldThread(jobId){
  const box=document.getElementById('fld-sms-box'); const btn=document.getElementById('fld-sms-toggle');
  if(!box) return;
  const opening = box.style.display==='none';
  box.style.display = opening?'block':'none';

  _stopFldSms();

    _fetchFldThread(jobId,false);

async function _fetchFldThread(jobId, quiet){
  const el=document.getElementById('fld-sms-thread');
  if(!el){ _stopFldSms(); return; }                    // screen changed — stop polling
  if(!quiet) el.innerHTML='<div class="muted" style="font-size:13px">Loading conversation…</div>';
  try{
    const token=await _acquireWorkerToken();
    const r=await fetch(SMS_WORKER_URL+'/sms/thread?leadId='+encodeURIComponent(jobId),{headers:{Authorization:'Bearer '+token}});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||'Could not load');
    const msgs=d.messages||[];
    const el2=document.getElementById('fld-sms-thread'); if(!el2){ _stopFldSms(); return; }
    if(!msgs.length){ el2.innerHTML='<div class="muted" style="font-size:13px">No messages yet — say hello or send \u201cOn my way\u201d.</div>'; return; }
    const pinned=(el2.scrollHeight-el2.scrollTop-el2.clientHeight)<30;
    el2.innerHTML=msgs.map(function(m){
      const out=m.direction==='out';
      const who=out?((m.user_upn?m.user_upn.split('@')[0]:'GreenKey')):'Customer';
      const dt=new Date(m.created_at);
      const ts=dt.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
      let media='';
      if(m.media_json){ try{ const items=JSON.parse(m.media_json)||[];
        media=items.map(function(it){ const u=(it&&it.url)?String(it.url):''; if(!u) return '';
          return /twilio\.com/i.test(u)
            ? '<div data-twmedia="'+esc(u)+'" class="muted" style="font-size:12px">📷 photo — loading…</div>'
            : '<img src="'+esc(u)+'" style="max-width:150px;border-radius:8px;display:block;margin:2px 0" alt="photo">';
        }).join(''); }catch(e){} }
      return '<div style="display:flex;justify-content:'+(out?'flex-end':'flex-start')+';margin:3px 0">'
        + '<div style="max-width:78%;padding:6px 10px;border-radius:10px;font-size:14px;line-height:1.35;white-space:pre-wrap;word-break:break-word;'
        + (out?'background:#12351f;border:1px solid #2b6a41;color:#d9f2e2':'background:#161b24;border:1px solid #2a3140;color:#e8eaed')+'">'
        + media + (m.body?esc(m.body):'')
        + '<div style="font-size:10px;color:#8b94a3;margin-top:2px">'+esc(who)+' · '+esc(ts)+'</div>'
        + '</div></div>';
    }).join('');
    _hydrateFldMedia(el2);
    if(!quiet || pinned) el2.scrollTop=el2.scrollHeight;
  }catch(e){
    const el3=document.getElementById('fld-sms-thread');
    if(el3 && !quiet) el3.innerHTML='<div class="muted" style="font-size:13px">Couldn\u2019t load texts ('+esc(e.message||'error')+'). Check signal and try again.</div>';
  }
}
async function _hydrateFldMedia(root){
  const nodes=root.querySelectorAll('[data-twmedia]'); if(!nodes.length) return;
  let token; try{ token=await _acquireWorkerToken(); }catch(e){ return; }
  for(const n of nodes){
    const u=n.getAttribute('data-twmedia'); n.removeAttribute('data-twmedia');
    try{
      const r=await fetch(SMS_WORKER_URL+'/sms/media?url='+encodeURIComponent(u),{headers:{Authorization:'Bearer '+token}});
      if(!r.ok) throw new Error();
      const b=await r.blob(); const obj=URL.createObjectURL(b);
      const img=document.createElement('img'); img.src=obj; img.alt='photo';
      img.style.cssText='max-width:150px;border-radius:8px;display:block;margin:2px 0';
      n.replaceWith(img);
    }catch(e){ n.textContent='📷 photo — view in the office CRM'; }
  }
}

    body:JSON.stringify({leadId:l.id,to:phone,message:message,templateKey:templateKey||'field_thread',customerName:custName(l)})});

// at rest (CSS min-height) and grows with the message up to the CSS max-height,
// after which it scrolls — so the tech can always read back and reword what he
// typed instead of watching one line slide past.
// PERFORMANCE: measuring scrollHeight forces a reflow, so this never runs once
// per keystroke — calls are coalesced into a single measure+write per animation
// frame. Fast typing or a paste costs one reflow, not one per character.
let _smsGrowRAF=null;
function _smsGrow(){

    t.style.height=t.scrollHeight+'px';                                // max-height clamps

}

// ---------- payment (Phase 3): record collected payment, sync back ----------
// Stamp lead.payment AND the paymentReceived milestone together. The office
// auto-archive fires on (final inspection passed + paymentReceived.done); before
// this, a field payment never set that milestone, so paid jobs never auto-closed.
// Direct jobs only — platform jobs are invoiced by the platform and don't gate.
function _stampPaymentMilestone(lead, amount, isoNow){
  if(!PLATFORMS.includes(lead.source)){
    if(!lead.milestones) lead.milestones={};
    lead.milestones.paymentReceived = { done:true, date:isoNow.slice(0,10), amount:amount||0 };
  }
}
// field-22 (2026-08-15): payments are a LEDGER now. `lead.payments[]` gets an
// APPEND on every collection; `lead.payment` stays maintained as a copy of the
// latest entry so the office's legacy readers (job banner, paid-invoice email)
// keep working. Before this, collecting a final payment OVERWROTE any earlier
// recorded payment on the job. Mirrors the CRM's `_pcLedgerAppend` exactly.
function _payLedgerAppend(leadObj, pay){
  if(!Array.isArray(leadObj.payments) || !leadObj.payments.length){
    leadObj.payments = (leadObj.payment && leadObj.payment.collectedAt) ? [Object.assign({},leadObj.payment)] : [];
  }
  leadObj.payments.push(pay);
  leadObj.payment = Object.assign({},pay);
}
function _payLedgerTotal(l){
  const led=((l&&Array.isArray(l.payments)&&l.payments.length)?l.payments:((l&&l.payment&&l.payment.collectedAt)?[l.payment]:[]))
    .reduce(function(s,p){ const a=p&&Number(p.amount); return s+((isFinite(a)&&a>0)?Math.round(a):0); },0);
  return led + priorPaid(l);
}
async function recordPayment(jobId, method, amount){
  try{ await syncFromSP(); }catch(e){}
  const arr=getLeads(); const i=arr.findIndex(l=>l.id===jobId); if(i<0) throw new Error('job not found');
  const now=new Date().toISOString();
  _payLedgerAppend(arr[i], { id:'pay_'+Date.now()+'_'+Math.round(Math.random()*1000000),
    method:method, amount:amount||0, collectedAt:now });
  // Milestone amount = TOTAL collected (ledger + deposits), matching the CRM.
  _stampPaymentMilestone(arr[i], _payLedgerTotal(arr[i]), now);
  arr[i].updatedAt = now;
  localStorage.setItem('gk_leads', JSON.stringify(arr));
  await pushLeads();
}
// Undo = remove the LAST ledger entry only (field-22). Earlier payments and
// deposits survive — clearing a mis-tap must not erase real money history.
async function clearPayment(jobId){
  try{ await syncFromSP(); }catch(e){}
  const arr=getLeads(); const i=arr.findIndex(l=>l.id===jobId); if(i<0) return;
  const l=arr[i];
  if(Array.isArray(l.payments) && l.payments.length){
    // field-28: leave a tombstone so the office merge (which UNIONS ledgers)
    // doesn't resurrect the entry from another machine's copy.
    const gone=l.payments[l.payments.length-1];
    const k=gone ? (gone.id || (String(gone.amount)+'|'+String(gone.collectedAt||gone.at||''))) : '';
    if(k){ l.voidedPayments=Array.isArray(l.voidedPayments)?l.voidedPayments:[]; l.voidedPayments.push({k, at:new Date().toISOString(), by:'field', reason:'undo'}); }
    l.payments.pop();
    if(l.payments.length){
      l.payment = Object.assign({}, l.payments[l.payments.length-1]);
      _stampPaymentMilestone(l, _payLedgerTotal(l), new Date().toISOString());
    } else {
      delete l.payments; delete l.payment;
      if(l.milestones && l.milestones.paymentReceived) delete l.milestones.paymentReceived;
    }
  } else {
    delete l.payment;
    if(l.milestones && l.milestones.paymentReceived) delete l.milestones.paymentReceived;
  }
  l.updatedAt=new Date().toISOString();
  localStorage.setItem('gk_leads', JSON.stringify(arr));
  await pushLeads();
}

// ---------- on-site amount adjustment (amount + required note; office sees it) ----------
async function adjustAmount(jobId){
  const l=getLeads().find(x=>x.id===jobId); if(!l){ alert('Job not found'); return; }
  const cur=(l.priceOverride&&typeof l.priceOverride.amount==='number')?l.priceOverride.amount:(quoteAmounts(l).net||'');
  // Wording matters: this is the JOB PRICE, not the balance. If someone types a
  // deposit-reduced figure here AND the deposit is recorded as a prior payment,
  // it comes off twice. Deposits belong on "＋ Deposit paid".
  const v=prompt('Adjusted JOB PRICE ($) — the full price, before any deposit:', cur===''?'':String(cur)); if(v===null) return;
  const amt=Math.round(parseFloat(v)||0); if(!amt||amt<=0){ alert('Enter a valid amount.'); return; }
  const note=prompt('Reason for the change (required — the office will see this):',''); if(note===null) return;
  if(!note.trim()){ alert('A reason is required so the office knows why it changed.'); return; }
  loading('Saving adjustment…');
  try{ await _saveAdjust(jobId, amt, note.trim()); }catch(e){ alert('Could not save: '+(e.message||e)); }
  renderDetail(jobId);
}
async function _saveAdjust(jobId, amount, note){
  try{ await syncFromSP(); }catch(e){}
  const arr=getLeads(); const i=arr.findIndex(l=>l.id===jobId); if(i<0) throw new Error('job not found');
  const acct=_msal&&_msal.getAllAccounts()[0]; const who=(acct&&(acct.name||acct.username))||'';
  arr[i].priceOverride={ amount:amount, note:note, by:who, at:new Date().toISOString() };
  arr[i].updatedAt=new Date().toISOString();
  localStorage.setItem('gk_leads', JSON.stringify(arr));
  await pushLeads();
}
async function clearAdjust(jobId){
  if(!confirm('Undo the on-site amount adjustment (back to the quoted amount)?')) return;
  loading('Updating…');
  try{ await syncFromSP(); const arr=getLeads(); const i=arr.findIndex(l=>l.id===jobId);
    if(i>=0){ delete arr[i].priceOverride; arr[i].updatedAt=new Date().toISOString(); localStorage.setItem('gk_leads',JSON.stringify(arr)); await pushLeads(); } }
  catch(e){ alert(e.message||e); }
  renderDetail(jobId);
}

// ---------- Stripe pay link: create + text from the business number ----------
async function _acquireWorkerToken(){
  const a=_msal.getAllAccounts()[0]; if(!a) throw new Error('Not signed in');
  try{ const r=await _msal.acquireTokenSilent({account:a,scopes:[SMS_SCOPE_URL]}); return r.accessToken; }
  catch(e){ const r=await _msal.acquireTokenSilent({account:a,scopes:[SMS_SCOPE_URL],forceRefresh:true}); return r.accessToken; }
}
async function textPayLink(jobId){
  const l=getLeads().find(x=>x.id===jobId); if(!l){ alert('Job not found'); return; }
  if(!isDirect(l)){ alert(l.source+' invoices the customer — do not collect on site.'); return; }
  const phone=leadPhone(l);
  if(!phone){ alert('No phone number on file for this customer — add one in the CRM first.'); return; }
  let amt=jobPayAmounts(l).card;
  if(!amt){ const v=prompt('Card amount to charge ($):',''); if(v===null) return; amt=Math.round(parseFloat(v)||0); }
  if(!amt||amt<=0){ alert('Enter a valid amount.'); return; }
  if(!confirm('Text a card payment link for '+fmt$(amt)+' to '+custName(l)+' ('+phone+')?')) return;
  loading('Creating payment link…');
  try{
    const token=await _acquireWorkerToken();
    const lr=await fetch(SMS_WORKER_URL+'/stripe/link',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({leadId:l.id,amount:amt,customerName:custName(l),description:prettyType(l.jobType)})});
    const ld=await lr.json().catch(()=>({}));
    if(!lr.ok||!ld.url) throw new Error(ld.error||'Could not create link');
    const first=(custName(l).trim().split(/\s+/)[0])||'there';
    const msg='Hi '+first+', here is your secure GreenKey card payment link for '+fmt$(amt)+': '+ld.url+'\nThank you! — GreenKey';
    const sr=await fetch(SMS_WORKER_URL+'/sms/send',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({leadId:l.id,to:phone,message:msg,templateKey:'stripe_pay_link',customerName:custName(l)})});
    const sd=await sr.json().catch(()=>({}));
    if(!sr.ok) throw new Error(sd.error||'Link created but the text failed to send');
    alert('✓ Payment link texted to '+custName(l)+'.\nThey pay by card — it shows here in the office once it clears.');
    // Track the ask on the office Payments page (cleared when payment lands).
    try{
      const arr2=getLeads(); const j=arr2.findIndex(x=>x.id===l.id);
      if(j>=0 && !(arr2[j].payment&&arr2[j].payment.collectedAt)){
        arr2[j].paymentExpected={amount:amt,methods:['card-link'],at:new Date().toISOString(),source:'field-link',memoCode:payMemoCode(l.id)};
        arr2[j].updatedAt=new Date().toISOString();
        localStorage.setItem('gk_leads',JSON.stringify(arr2));
        await pushLeads();
      }
    }catch(_){}
  }catch(e){ alert('Could not send pay link: '+(e.message||e)); }
  renderDetail(jobId);
}
async function doPayment(jobId, method, amount){
  if(!amount){ const v=prompt('Amount collected ($):',''); if(v===null) return; amount=Math.round(parseFloat(v)||0); }
  const label = method==='card'?'card':(method==='zelle'?'Zelle':'cash/check');
  if(!confirm('Record '+fmt$(amount)+' '+label+' payment collected for this job?')) return;
  loading('Recording payment…');
  try{ await recordPayment(jobId, method, amount); }catch(e){ alert('Could not record: '+(e.message||e)); }
  renderDetail(jobId);
}
// Recording money that came in BEFORE today — a QuickBooks deposit invoice, a
// Zelle that landed last week. Deliberately NOT the same store as lead.payment,
// which is the single on-site collection slot the office reconciles; writing
// deposits there would overwrite it and lose one of the two figures.
async function addPriorPayment(jobId){
  const l=getLeads().find(x=>x.id===jobId); if(!l){ alert('Job not found'); return; }
  const v=prompt('Amount the customer has ALREADY paid ($):',''); if(v===null) return;
  const amt=Math.round(parseFloat(v)||0);
  if(!amt||amt<=0){ alert('Enter a valid amount.'); return; }
  const q=quoteAmounts(l); const gross=(q.card!=null?q.card:q.net);
  if(gross!=null && amt>gross && !confirm('That is more than the quoted '+fmt$(gross)+'. Record it anyway?')) return;
  const m=prompt('How was it paid? (deposit / zelle / card / cash / check)','deposit'); if(m===null) return;
  const note=prompt('Note (optional) \u2014 e.g. "QuickBooks deposit invoice, paid 8/10":','');
  loading('Recording\u2026');
  try{ await _savePriorPayment(jobId, amt, String(m||'deposit').trim().toLowerCase(), String(note||'').trim()); }
  catch(e){ alert('Could not save: '+(e.message||e)); }
  renderDetail(jobId);
}
async function _savePriorPayment(jobId, amount, method, note){
  try{ await syncFromSP(); }catch(e){}
  const arr=getLeads(); const i=arr.findIndex(l=>l.id===jobId); if(i<0) throw new Error('job not found');
  const acct=_msal&&_msal.getAllAccounts()[0]; const who=(acct&&(acct.name||acct.username))||'';
  if(!Array.isArray(arr[i].priorPayments)) arr[i].priorPayments=[];
  arr[i].priorPayments.push({ id:'pp_'+Date.now()+'_'+Math.round(Math.random()*1000000),
    amount:amount, method:method||'deposit', note:note||'', by:who, at:new Date().toISOString() });
  arr[i].updatedAt=new Date().toISOString();
  localStorage.setItem('gk_leads', JSON.stringify(arr));
  await pushLeads();
}
async function removePriorPayment(jobId, ppId){
  const l=getLeads().find(x=>x.id===jobId); if(!l) return;
  const p=priorPayments(l).find(x=>String(x.id)===String(ppId)); if(!p) return;
  if(!confirm('Remove the '+fmt$(p.amount)+' credit?\n\nThe amount to collect goes back UP by '+fmt$(p.amount)+'.')) return;
  loading('Updating\u2026');
  try{
    try{ await syncFromSP(); }catch(e){}
    const arr=getLeads(); const i=arr.findIndex(x=>x.id===jobId); if(i<0) throw new Error('job not found');
    arr[i].priorPayments=priorPayments(arr[i]).filter(x=>String(x.id)!==String(ppId));
    arr[i].updatedAt=new Date().toISOString();
    localStorage.setItem('gk_leads', JSON.stringify(arr));
    await pushLeads();
  }catch(e){ alert('Could not update: '+(e.message||e)); }
  renderDetail(jobId);
}
async function doClearPayment(jobId){
  if(!confirm('Undo the LAST recorded payment? Earlier payments and deposits on this job are kept.')) return;
  loading('Updating…');
  try{ await clearPayment(jobId); }catch(e){ alert(e.message||e); }
  renderDetail(jobId);
}

// ---------- self-update check (field-13) ----------
// WHY THIS EXISTS. The app is one HTML file on GitHub Pages, added to the iOS
// home screen. A home-screen web app gets its own cache with no address bar, no
// reload button, and no gesture that bypasses it — so a pushed change could sit
// unseen for as long as that cache held it, and the only reliable cure was
// deleting the icon and re-adding it from a pasted URL. Jonathan, 2026-08-01:
// "having to delete the app and reload it via pasting an address … is a problem."
//
// So the app watches its own build stamp. The check is a conditional request:
// `cache:'no-cache'` means the browser always asks the server, sending the ETag —
// unchanged is a ~300-byte 304, changed is a full 200 that ALSO writes the new
// copy into the browser cache. That last part is the whole trick: it is what
// makes the plain location.reload() below actually serve new code.
//
// ⚠ It NEVER reloads on its own. A tech halfway through a text or a photo upload
// decides when. The bar is the only thing that appears by itself.
const UPD_CHECK_MS = 15*60*1000;          // foreground re-check interval
let _updLast = 0, _updOffered = '';
function _updBuildFrom(txt){
  // Built via RegExp() rather than a literal so this line can never match itself.
  const m = new RegExp("const BUILD\\s*=\\s*'([^']+)'").exec(txt);
  return m ? m[1] : '';
}
// True when we escalated to a ?v= URL and STILL came up on the old build —
// i.e. the cache beat us and there is nothing more the page can do by itself.
function _updStuck(){
  const m = /[?&]v=([^&]+)/.exec(location.search||'');
  try{ return !!(m && decodeURIComponent(m[1]) !== BUILD); }catch(e){ return false; }
}
async function checkForUpdate(force){
  const now = Date.now();
  if(!force && now - _updLast < UPD_CHECK_MS) return;
  _updLast = now;
  try{
    const r = await fetch(location.pathname, {cache:'no-cache'});
    if(!r.ok) return;
    const live = _updBuildFrom(await r.text());
    if(!live) return;                               // not our file (404 page?)
    if(live === BUILD){ _updClearBar(); return; }   // already current
    if(live === _updOffered) return;                // bar is already up for this one
    let dismissed=''; try{ dismissed = localStorage.getItem('gk_upd_dismissed')||''; }catch(e){}
    if(dismissed === live) return;                  // he said not now
    _updOffered = live;
    _updShowBar(live);
  }catch(e){ /* no signal / blocked — silent, we try again next foreground */ }
}
function _updClearBar(){ const b=document.getElementById('updbar'); if(b) b.remove(); }
function _updShowBar(live){
  _updClearBar();
  const stuck = _updStuck();
  const d = document.createElement('div');
  d.id='updbar'; d.className='updbar';
  d.innerHTML = '<div class="t">'
      + (stuck ? 'Update didn’t take — force-quit the app and reopen it.'
               : 'Update ready — ' + esc(live))
      + '</div>'
    + (stuck ? '' : '<button class="go" id="updgo">Update</button>')
    + '<button class="x" id="updx" aria-label="Not now">✕</button>';
  document.body.appendChild(d);
  const go = document.getElementById('updgo');
  if(go) go.onclick = function(){ applyUpdate(live); };
  document.getElementById('updx').onclick = function(){
    try{ localStorage.setItem('gk_upd_dismissed', live); }catch(e){}
    _updClearBar();
  };
}
// Stage 1: a plain reload. The check above already refreshed the cached copy, so
// this is normally all it takes.
function applyUpdate(live){
  try{ localStorage.removeItem('gk_upd_dismissed'); }catch(e){}
  try{ sessionStorage.setItem('gk_upd_want', live); }catch(e){}
  location.reload();
}
// Stage 2, run on the way back up: if the reload handed us the OLD build anyway,
// go to the same file under a ?v= query — a cache key iOS has never seen and
// therefore cannot answer from cache. Runs before boot so nothing else loads
// first. Terminates by design: the marker is consumed here, so the worst case is
// one escalation per tap, and _updStuck() then tells the truth instead of looping.
function _updAfterReload(){
  let want=''; try{ want = sessionStorage.getItem('gk_upd_want')||''; }catch(e){}
  if(!want) return;
  try{ sessionStorage.removeItem('gk_upd_want'); }catch(e){}
  if(want === BUILD) return;                        // stage 1 did it
  location.replace(location.pathname + '?v=' + encodeURIComponent(want));
}
_updAfterReload();
// Runs whether or not anyone is signed in — a stale copy is stale on the login
// screen too, and Chase should get the bar before he has to think about it.
checkForUpdate(true);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkForUpdate(false); });

// ---------- boot ----------
(async function boot(){
  try{
    const account = await initAuth();
    if(!account){ renderLogin(); return; }
    const tok = await getTokenSilent();
    if(!tok){ renderLogin(); return; }
    const hadData = getLeads().length>0;
    if(!hadData) loading('Loading your jobs…');
    try{ await spInit(); await syncFromSP(); }
    catch(e){ console.warn('[field] sync', e); if(!hadData){ $app().innerHTML='<div class="center"><div class="err">Could not load jobs.</div><div class="muted" style="font-size:13px;max-width:300px">'+esc(e.message||e)+'</div><button class="btn ghost" style="max-width:240px" onclick="location.reload()">Retry</button><button class="btn ghost" style="max-width:240px" onclick="signOut()">Sign out</button></div>'; return; } }
    // Always open on My Jobs (field-14, Jonathan 2026-08-03). iOS relaunches the
    // saved app with its last URL, so a leftover #job= hash restored whatever job
    // was open when the phone was put away. Strip it here — replaceState so no
    // hashchange fires — then route() lands on the list. refresh() still keeps
    // you on the job you're looking at; only a cold open comes home.
    if(location.hash){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; } }
    // field-21: rehydrate the offline photo queue and start draining anything
    // left over from a dead-zone job. Also ask the browser to treat our
    // storage as persistent so iOS doesn't evict queued photos under pressure.
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
    try{ await _pqLoad(); }catch(e){}
    if(_pqCache.length) _pqDrain();
    route();
  }catch(e){
    console.error('[field] boot', e);
    $app().innerHTML='<div class="center"><div class="err">Sign-in problem</div><div class="muted" style="font-size:13px;max-width:300px">'+esc(e.message||e)+'</div><button class="btn green" style="max-width:240px" onclick="signIn()">Sign in with Microsoft</button></div>';
  }
})();
</script>
