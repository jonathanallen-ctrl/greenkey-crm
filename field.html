<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22GreenKey%20Field%22%2C%22short_name%22%3A%22Field%22%2C%22start_url%22%3A%22./field.html%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f1117%22%2C%22theme_color%22%3A%22%230f1117%22%7D">
<title>GreenKey Field</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* touch-action pan-only: finger drags scroll, but two-finger pinch-zoom is
     ignored — keeps the app locked to its single-column layout on the iPad. */
  html,body{margin:0;background:#0f1117;color:#e8eaed;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;font-size:16px;line-height:1.4;touch-action:pan-x pan-y}
  /* Read-only text is non-selectable so a finger-drag always scrolls; inputs re-enabled. */
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
  input,textarea{-webkit-user-select:text;user-select:text}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:640px;margin:0 auto;padding:12px}
  .muted{color:#8b93a1}
  .top{position:sticky;top:0;z-index:5;background:#0f1117;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;border-bottom:1px solid #1d222c}
  .top .ttl{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-size:13px;font-weight:700;letter-spacing:.3px}
  .brand .b2{color:#36c777}
  .build{font-size:10px;color:#5d6675}
  h1{font-size:22px;font-weight:700;margin:8px 0 2px}
  /* Detail views (field-14): the title row IS the way back. h1 becomes a tappable
     "‹ My Jobs" in brand green; the view name moves to a small right-hand label. */
  .h1row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .h1row h1.hback{color:#36c777;cursor:pointer}
  .hlab{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#8b93a1;flex-shrink:0}
  .srch{width:100%;margin-top:10px;padding:11px 12px;border:1px solid #262b36;border-radius:10px;background:#171a21;color:#e8eaed;font-size:15px;outline:none}
  /* SMS composer (field-13). Phone-style multi-line box: THREE lines visible at
     rest so a whole text can be read back and reworded before sending, growing
     to ~8 lines and then scrolling. Heights are in em so they track the font
     size; box-sizing is border-box globally, hence the +20px for padding+border.
     resize:none because the drag handle fights the pan-scroll gesture on iOS. */
  .smsbox{flex:1;min-width:0;background:#0d1117;border:1px solid #2a3140;border-radius:10px;color:#e8eaed;font-family:inherit;font-size:15px;line-height:1.35;padding:9px 12px;outline:none;resize:none;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:calc(4.05em + 20px);max-height:calc(10.8em + 20px)}
  /* Compact square button for the "from Photos" pickers next to a camera button. */
  .ibtn{background:#171a21;color:#e8eaed;border:1px solid #2a313d;border-radius:10px;padding:8px 11px;font-size:15px;flex:0 0 auto;cursor:pointer;line-height:1}
  .sec{margin:18px 0 6px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#8b93a1}
  .card{display:block;background:#171a21;border:1px solid #262b36;border-radius:12px;padding:14px;margin-bottom:10px;content-visibility:auto;contain-intrinsic-size:0 92px}
  .card:active{background:#1c2027}
  .jrow{display:flex;align-items:center;gap:10px}
  .jname{font-size:16px;font-weight:600;line-height:1.25}
  .jaddr{font-size:13px;color:#aeb4bf;margin-top:2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{font-size:11px;padding:3px 8px;border-radius:20px;background:#0f1117;border:1px solid #2a313d;color:#aeb4bf}
  .chip.blue{background:rgba(54,140,255,.14);border-color:transparent;color:#6db0ff}
  .chip.amber{background:rgba(255,176,32,.14);border-color:transparent;color:#ffc861}
  .chev{margin-left:auto;color:#5d6675;flex-shrink:0}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:12px;font-size:16px;font-weight:600;border:none;width:100%;cursor:pointer}
  .btn.green{background:#36c777;color:#08130c}
  .btn.ghost{background:#171a21;color:#e8eaed;border:1px solid #2a313d}
  .row2{display:flex;gap:10px;margin:12px 0}
  .row2 a,.row2 .btn{flex:1}   /* .btn is width:100% — flex-basis 0 makes them share the row */
  .back{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:#aeb4bf;padding:6px 0;margin-bottom:4px}
  .lab{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#8b93a1;margin-bottom:6px}
  .scope{font-size:15px;line-height:1.55;white-space:pre-wrap;color:#dfe3e9}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .pcell{aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid #262b36;background:#11141a;content-visibility:auto;contain-intrinsic-size:96px 96px}
  .pcell img{width:100%;height:100%;object-fit:cover;display:block}
  .pay{background:linear-gradient(135deg,rgba(54,199,119,.16),rgba(54,199,119,.05));border:1px solid #2f6b46;border-radius:12px;padding:14px;margin-bottom:12px}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:24px;gap:14px}
  .spin{width:34px;height:34px;border:3px solid #262b36;border-top-color:#36c777;border-radius:50%;animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{color:#ff8a8a;font-size:14px}
  .empty{color:#8b93a1;text-align:center;padding:40px 12px;font-size:14px}
  /* Update bar (field-13) — see checkForUpdate(). Fixed above the home indicator
     so it never reflows the page out from under someone mid-job. */
  .updbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:#12351f;border-top:1px solid #2b6a41;box-shadow:0 -6px 18px rgba(0,0,0,.35)}
  .updbar .t{flex:1;min-width:0;font-size:14px;line-height:1.3;color:#d9f2e2}
  .updbar button{flex:0 0 auto;border:none;border-radius:10px;font-size:15px;font-weight:600;padding:10px 14px;cursor:pointer;font-family:inherit}
  .updbar .go{background:#36c777;color:#08130c}
  .updbar .x{background:transparent;color:#8fb9a2;padding:10px 6px;font-size:16px}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spin"></div><div class="muted">Connecting…</div></div></div>

<script>
// ============ GreenKey Field — lean mobile tool (Phase 1: read) ============
const BUILD = '2026-08-03 field-14';
// Memo code shown with the Zelle QR so the deposit self-identifies at the bank.
// MUST match payMemoCode() in the CRM's index.html.
function payMemoCode(id){ const d=String(id||'').replace(/[^0-9]/g,''); return 'GK-'+(d.slice(-4)||'0000'); }
const AZURE_CLIENT_ID = '61b4a86a-2b6f-4e14-90f9-a8df8ecadf69';
const AZURE_TENANT_ID = '48b33cc0-0d51-46d6-8b85-53b6ebfc0b0f';
const FIELD_URL       = location.origin + location.pathname; // this page
// 2026-07-13 (Phase 2 auth): redirect is now THIS page, so a cold device (an
// iPad or a tech's phone that never opened the main CRM) can sign in directly
// and land back here. ⚠ REQUIRES the one-time Azure step BEFORE this deploys:
// portal.azure.com → App registrations → the CRM app (61b4a86a…) →
// Authentication → Single-page application → Add URI:
//   https://jonathanallen-ctrl.github.io/greenkey-crm/field.html
// (Adding a URI doesn't affect the main CRM. Warm devices keep working either way.)
const AUTH_REDIRECT   = 'https://jonathanallen-ctrl.github.io/greenkey-crm/field.html';
const SP_HOSTNAME     = 'greenkeyusa.sharepoint.com';
const SP_LIST_NAME    = 'GreenKeyCRM_Data';
const SP_PHOTO_LIB    = 'CEO/CRM software/GreenKeyCRM_Photos';
const GRAPH_SCOPES    = ['https://graph.microsoft.com/Sites.ReadWrite.All','User.Read'];
const ZELLE_EMAIL     = 'jonathan.allen@greenkey-usa.com';
const PLATFORMS       = ['Qmerit','Electrum','Treehouse'];
// SMS Relay worker (same as the main CRM) — used to create + text a Stripe
// payment link. The main CRM and this app share the same Azure client app, so
// the SMS.send scope is already consented; the token acquires silently.
const SMS_WORKER_URL  = 'https://greenkey-sms.greenkey-usa.workers.dev';
const SMS_SCOPE_URL   = 'api://f4704bd1-8316-4740-8f59-540901153810/SMS.send';

let _msal=null,_gToken=null,_spSite=null,_spList=null,_spDrive=null;
const $app = ()=>document.getElementById('app');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- data (shared localStorage with the main CRM) ----------
function getLeads(){ try{return JSON.parse(localStorage.getItem('gk_leads')||'[]')}catch(e){return[]} }
function getCustomers(){ try{return JSON.parse(localStorage.getItem('gk_customers')||'[]')}catch(e){return[]} }
function getCustomer(id){ return getCustomers().find(c=>c.id===id)||null; }
function custName(l){ const c=l.customerId?getCustomer(l.customerId):null; if(c){ const n=((c.firstName||'')+' '+(c.lastName||'')).trim(); return n||c.businessName||l.customerName||l.id; } return l.customerName||((l.customerFirstName||'')+' '+(l.customerLastName||'')).trim()||l.id; }
function leadAddr(l){ return [l.siteStreet,l.siteCity,l.siteState||'VA',l.siteZip].filter(Boolean).join(', '); }
function leadPhone(l){ const c=l.customerId?getCustomer(l.customerId):null; return (c&&c.phone)||l.customerPhone||''; }
function prettyType(t){ if(!t) return ''; return String(t).replace(/[-_]/g,' ').replace(/\b\w/g,m=>m.toUpperCase()); }
function schedDate(l){ return (l.milestones&&l.milestones.installScheduled&&l.milestones.installScheduled.date)||l.scheduleAt||''; }
// ── APPOINTMENTS (2026-07-31) ──
// The CRM moved to lead.appointments[] so a job can hold more than one visit.
// Only INSTALLATION appointments mirror back into milestones.installScheduled,
// which is what schedDate() reads — so a scheduled WALKDOWN had no date the
// field app could see, and only surfaced if the job happened to be sitting in
// the 'info-gathering' stage. Scheduling a walkdown deliberately does NOT move
// the stage any more, so in practice they never appeared at all: Chase did two
// on 2026-07-30 and had to photograph and text everything by hand.
// Mirrors getAppts() in index.html — keep the two in step.
var WALKDOWN_TYPES = ['walkdown','phone-call'];
function apptsOf(l){
  if(!l) return [];
  if(Array.isArray(l.appointments)) return l.appointments;
  var im = l.milestones && l.milestones.installScheduled;
  if(im && im.date) return [{id:'appt-legacy-install',type:'installation',date:im.date,time:im.time||''}];
  return [];
}
function apptLabel(t){
  var M={installation:'Installation',walkdown:'Walkdown','phone-call':'Phone / Video',troubleshoot:'Service Call',maintenance:'Maintenance',inspection:'Final Inspection','quote-review':'Quote Review','material-pickup':'Material Pickup','follow-up':'Follow-Up',other:'Visit'};
  return M[t]||'Visit';
}
function isWalkdownAppt(a){ return !!a && WALKDOWN_TYPES.indexOf(a.type)>=0; }
function prettyTime(t){
  if(!t) return '';
  var p=String(t).split(':'), h=parseInt(p[0],10); if(isNaN(h)) return '';
  var ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+(p[1]||'00')+' '+ap;
}
// Every booked, not-yet-completed appointment across the active jobs, as
// {lead, appt} pairs — the field app's real unit of work is a VISIT, not a job.
function apptEntries(leads){
  var out=[];
  leads.forEach(function(l){
    apptsOf(l).forEach(function(a){
      if(a && a.date && !a.completedAt) out.push({l:l,a:a});
    });
  });
  return out.sort(function(x,y){
    return (x.a.date+(x.a.time||'')).localeCompare(y.a.date+(y.a.time||''));
  });
}
function isDirect(l){ return !PLATFORMS.includes(l.source); }
function activeLeads(){ return getLeads().filter(l=>l && !['archived','closed-won','closed-lost','not-won'].includes(l.stage) && !(l.lostInfo&&l.lostInfo.isLost)); }
function getQuotes(){ try{return JSON.parse(localStorage.getItem('gk_quotes')||'[]')}catch(e){return[]} }
function fmt$(n){ return '$'+Number(n||0).toLocaleString('en-US'); }
// The quote amount as originally priced: card = quoteTotal (w/ fee), net = preProcessingTotal. Falls back to jobValue.
function quoteAmounts(l){
  const q = l.acceptedQuoteId ? getQuotes().find(x=>x.id===l.acceptedQuoteId) : null;
  if(q){ const net=(typeof q.preProcessingTotal==='number'&&isFinite(q.preProcessingTotal))?Math.round(q.preProcessingTotal):null;
         const card=(typeof q.quoteTotal==='number'&&isFinite(q.quoteTotal))?Math.round(q.quoteTotal):net; return {net,card}; }
  const jv=(l.jobValue&&typeof l.jobValue.amount==='number'&&isFinite(l.jobValue.amount))?Math.round(l.jobValue.amount):null;
  return {net:jv, card:jv};
}
// ── Install Spec ──────────────────────────────────────────────────────────
// Assembled from data the office ALREADY maintains — there are no new fields to
// fill in anywhere. Panel + service come from the job's Electrical Snapshot;
// breaker amps, wire gauge/metal, tandem count and run length come from the
// accepted quote's Quick Quote. Mirrors index.html's EVNEMA_WIRE_OPTIONS (amps
// are only stated for the two standard wires — we show a breaker size only when
// it's actually known rather than guessing on the long-run variants).
const EV_WIRE_SPEC = {
  '8cu': { wire:'#8 Cu', amps:'50 A' },
  '6cu': { wire:'#6 Cu', amps:'60 A' },
  '4cu': { wire:'#4 Cu', amps:'' },
  '2al': { wire:'#2 Al', amps:'' }
};
const RUN_LABEL = { crawl:'crawl space', attic:'attic', unfinished:'unfinished space',
  surface:'surface conduit', 'hand-trench':'trench (hand dug)', 'machine-trench':'trench (machine)' };
function _installSpecRows(l){
  const rows=[]; if(!l) return rows;
  const s=l.electricalSnapshot||{};
  const panel = s.panelBrand==='Other' ? (s.panelBrandOther||'Other') : (s.panelBrand||'');
  if(panel)        rows.push(['Panel', panel]);
  if(s.serviceSize) rows.push(['Service', s.serviceSize]);
  // Breaker: the Electrical Snapshot is authoritative when it's filled in; the
  // quote's wire choice is only a fallback (it implies amps for the two standard
  // wires). Shows "— not recorded —" when neither is known, so the tech can see
  // the gap rather than silently getting no breaker line at all.
  const bkr = s.breakerSize==='Other' ? (s.breakerSizeOther||'') : (s.breakerSize||'');
  const q = l.acceptedQuoteId ? getQuotes().find(x=>x.id===l.acceptedQuoteId) : null;
  const qq = q && q.qq ? q.qq : null;
  const w = qq ? EV_WIRE_SPEC[qq.evWireId||'6cu'] : null;
  if(bkr)                 rows.push(['Breaker', bkr]);
  else if(w && w.amps)    rows.push(['Breaker', w.amps+' 2-pole (from quote)']);
  else if(panel||qq)      rows.push(['Breaker', '— not recorded —']);
  if(qq){
    if(w) rows.push(['Wire', w.wire]);
    if(typeof qq.tandemBreakers==='number')
      rows.push(['Tandems', qq.tandemBreakers>0 ? (qq.tandemBreakers+' needed') : 'None']);
    const segs = Array.isArray(qq.runSegs)?qq.runSegs:[];
    if(segs.length){
      const total = segs.reduce((n,sg)=>n+(parseInt(sg.ft)||0),0);
      const routes = [...new Set(segs.map(sg=>RUN_LABEL[sg.type]||sg.type))].filter(Boolean).join(', ');
      if(total) rows.push(['Run', total+' ft'+(routes?(' — '+routes):'')]);
    }
  }
  // Carry the BRH rule all the way to the person actually holding the breaker —
  // the mistake happens at the supply house or in the truck, not at the desk.
  if(/Eaton BR/i.test(panel||'') && /60-amp/i.test(bkr||''))
    rows.push(['⚠ Breaker', 'Use BRH260 — BR260 not used on EV loads']);
  // If the office scheduled without the spec, show WHY so the tech isn't guessing.
  if(l.specSkip && l.specSkip.why) rows.push(['⚠ Spec', l.specSkip.why]);
  return rows;
}

// Amount to actually COLLECT. If the tech made an on-site adjustment, that single
// figure is what we charge on every method; otherwise fall back to the quote.
function jobPayAmounts(l){
  if(l && l.priceOverride && typeof l.priceOverride.amount==='number' && isFinite(l.priceOverride.amount)){
    const a=Math.round(l.priceOverride.amount); return {net:a, card:a, overridden:true};
  }
  return quoteAmounts(l);
}

// ---------- auth ----------
async function loadMsal(){ const m = await import('https://esm.sh/@azure/msal-browser@2'); window.msal = m; return m; }
async function initAuth(){
  await loadMsal();
  _msal = new msal.PublicClientApplication({
    auth:{ clientId:AZURE_CLIENT_ID, authority:'https://login.microsoftonline.com/'+AZURE_TENANT_ID, redirectUri:AUTH_REDIRECT },
    cache:{ cacheLocation:'localStorage', storeAuthStateInCookie:false }
  });
  let resp=null; try{ resp = await _msal.handleRedirectPromise(); }catch(e){ console.warn('[field] redirect promise', e); }
  let account = (resp&&resp.account) || (_msal.getAllAccounts()[0]) || null;
  if(account) _msal.setActiveAccount(account);
  return account;
}
async function getTokenSilent(){
  const a=_msal.getAllAccounts()[0]; if(!a) return null;
  try{ const tr=await _msal.acquireTokenSilent({account:a,scopes:GRAPH_SCOPES}); _gToken=tr.accessToken; return _gToken; }
  catch(e){ console.warn('[field] silent token failed', e); return null; }
}
function signIn(){ _msal.loginRedirect({scopes:GRAPH_SCOPES}); }
function signOut(){ try{ localStorage.removeItem('gk_session'); }catch(e){} _msal.logoutRedirect({postLogoutRedirectUri:AUTH_REDIRECT}); }

// ---------- graph + sharepoint read ----------
async function graphFetch(path){
  const url = path.startsWith('https://') ? path : 'https://graph.microsoft.com/v1.0'+path;
  const go = ()=>fetch(url,{headers:{Authorization:'Bearer '+_gToken}});
  let r=await go();
  if(r.status===401){ const a=_msal.getAllAccounts()[0]; if(a){ try{ const tr=await _msal.acquireTokenSilent({account:a,scopes:GRAPH_SCOPES,forceRefresh:true}); _gToken=tr.accessToken; r=await go(); }catch(e){} } }
  if(!r.ok) throw new Error('Graph '+r.status);
  return r.json();
}
async function spInit(){
  if(_spSite) return;
  const site = await graphFetch('/sites/'+SP_HOSTNAME); _spSite=site.id;
  const lists = await graphFetch('/sites/'+_spSite+'/lists?$select=id,name,displayName&$top=100');
  const l = (lists.value||[]).find(x=>x.displayName===SP_LIST_NAME||x.name===SP_LIST_NAME);
  _spList = l?l.id:null;
  try{ const dr = await graphFetch('/sites/'+_spSite+'/drive'); _spDrive = dr.id; }catch(e){ console.warn('[field] drive', e); }
}
async function syncFromSP(){
  if(!_spList) throw new Error('CRM data list not found');
  let next='/sites/'+_spSite+'/lists/'+_spList+'/items?$expand=fields&$top=200'; const got={};
  while(next){ const res=await graphFetch(next); for(const it of (res.value||[])){ const k=it.fields&&it.fields.Title, v=it.fields&&it.fields.DataValue; if(k&&v) got[k]=v; } next=res['@odata.nextLink']||null; }
  // Read-only: overwrite the keys this tool needs.
  ['gk_leads','gk_customers','gk_quotes'].forEach(k=>{ if(got[k]) localStorage.setItem(k,got[k]); });
}
async function loadJobPhotos(jobId){
  if(!_spDrive) return [];
  let cats=[]; try{ const c=await graphFetch('/drives/'+_spDrive+'/root:/'+encodeURI(SP_PHOTO_LIB+'/'+jobId)+':/children'); cats=c.value||[]; }
  catch(e){ return []; }
  const out=[];
  for(const cat of cats){ if(!cat.folder) continue;
    try{ const f=await graphFetch('/drives/'+_spDrive+'/items/'+cat.id+'/children');
      for(const it of (f.value||[])){ if(it.file && /^image\//.test(it.file.mimeType||'') && it['@microsoft.graph.downloadUrl']) out.push({name:it.name,url:it['@microsoft.graph.downloadUrl'],cat:cat.name}); }
    }catch(e){}
  }
  return out;
}

// ---------- views ----------
function loading(msg){ $app().innerHTML = '<div class="center"><div class="spin"></div><div class="muted">'+esc(msg||'Loading…')+'</div></div>'; }
function renderLogin(){
  $app().innerHTML =
    '<div class="center">'
    + '<div class="brand" style="font-size:20px">Green<span class="b2">Key</span> Field</div>'
    + '<div class="muted" style="max-width:280px">Your jobs for the day — fast, in your pocket.</div>'
    + '<button class="btn green" style="max-width:280px" onclick="signIn()">Sign in with Microsoft</button>'
    + '<div class="build muted" style="margin-top:8px">'+esc(BUILD)+'</div>'
    + '</div>';
}
// header(title) — list screens: plain h1 title.
// header(title, true) — detail screens: the h1 slot becomes a big tappable
// "‹ My Jobs" (Jonathan 2026-08-03: the old small back link sat below the fold
// inside the job and was easy to miss); the view name shrinks to a right label.
function header(title, back){
  return '<div class="top"><div class="ttl"><div class="brand">Green<span class="b2">Key</span> Field <span class="muted" style="font-weight:500">'+esc(BUILD)+'</span></div>'
    + '<div><button class="chip" onclick="refresh()" style="margin-right:6px">↻</button><button class="chip" onclick="signOut()">Sign out</button></div></div>'
    + (back
       ? '<div class="h1row"><h1 class="hback" onclick="goJobs()">‹ My Jobs</h1><span class="hlab">'+esc(title)+'</span></div>'
       : '<h1>'+esc(title)+'</h1>')
    + '</div>';
}
let _search='';
function renderJobs(){
  const today=new Date(); today.setHours(0,0,0,0); const todayStr=today.toISOString().slice(0,10);
  const leads=activeLeads();
  let body='';
  if(_search.trim()){

function renderWalkdown(id){
  const l=activeLeads().find(x=>x.id===id) || getLeads().find(x=>x.id===id);
  if(!l){ $app().innerHTML=header('Walkdown', true)+'<div class="wrap"><div class="empty">Job not found.</div></div>'; return; }

  const w=l.walkdown||{}, s=l.electricalSnapshot||{};

  // ── Pick-lists that MATCH THE CRM (2026-07-31) ──
  // These were free text. Whatever got typed was preserved and shown to the
  // office, so nothing was ever lost — but it had to be re-keyed into the
  // structured Electrical Snapshot before it could do any work, and anything
  // that didn't match a dropdown value silently did nothing. The BRH260
  // auto-adder is the sharp example: it only fires when panelBrand starts with
  // "Eaton BR", so "Square D Homline" typed with a missing 'e' costs $50 quietly.
  // Same options as SNAP_PANEL_BRAND_OPTIONS / SNAP_BREAKER_SIZE_OPTIONS in
  // index.html — ⚠ keep these three lists in step with that file.
  // "Other" keeps the free-text escape: a crawlspace is no place to be blocked
  // by a dropdown that doesn't have your panel on it.
  const WD_SERVICE = ['400A','300A','200A','150A','100A','Other'];
  const WD_PANEL   = ['Sq D Homeline','Sq D QO','Siemens QP','GE/ABB','Eaton CH','Eaton BR','Eaton BRH','Other'];
  const WD_BREAKER = ['200-amp','150-amp','125-amp','100-amp','60-amp','Other'];
  const pick=(fid,lab,val,opts,ph)=>{
    var cur=(val||'').trim();

      + '<select id="'+fid+'" class="srch" style="margin-top:0" onchange="wdOther(\''+fid+'\')">'

      + '</select>'
      + '<input id="'+fid+'-other" class="srch" style="margin-top:6px;display:'+(isOther?'block':'none')+'" value="'+esc(isOther?cur:'')+'" placeholder="'+esc(ph||'Type it exactly as it reads on the label')+'">'
      + '</div>';

    + '<div class="wrap">'
    + '<div class="jname" style="font-size:20px">'+esc(custName(l))+'</div>'

    + '<div class="row2">'

    + (maps?'<a class="btn ghost" href="'+maps+'" target="_blank" rel="noopener">🧭 Navigate</a>':'')
    + '</div>'
    + '<div class="card"><div class="lab" style="margin-bottom:8px">Site electrical — for the estimate</div>'
    +   pick('wd-service','Service size', w.serviceSize||s.serviceSize, WD_SERVICE, 'e.g. 320A meter-main')
    +   pick('wd-panel','Panel make / model', w.panelMake||s.panelBrand, WD_PANEL, 'e.g. Bryant BR — read it off the label')
    +   pick('wd-breaker','Main breaker', w.mainBreaker||s.breakerSize, WD_BREAKER, 'e.g. 175-amp')
    +   fld('wd-spaces','Open breaker spaces', w.openSpaces, 'e.g. 4 (2 tandem)')
    +   '<div class="lab">Notes for the estimator</div>'
    +   '<textarea id="wd-notes" class="srch" style="margin-top:0;min-height:90px;resize:vertical">'+esc(l.walkdownNotes||'')+'</textarea>'
    +   '<button class="btn green" style="margin-top:12px" onclick="saveWalkdown(\''+esc(l.id)+'\')">Save walkdown info</button>'
    + '</div>'
    + '<div class="card"><div class="lab" style="display:flex;align-items:center;justify-content:space-between;gap:6px">Photos'
    +   '<span style="display:flex;gap:6px;flex:0 0 auto">'
    +     '<button class="chip" onclick="shotPick(\''+esc(l.id)+'\',\'walkdown\')">📸 Take photo</button>'
    +     '<button class="chip" onclick="shotPick(\''+esc(l.id)+'\',\'walkdown\',1)">🖼️ From Photos</button>'

    +   '<input type="file" id="ph-input-lib" accept="image/*" multiple style="display:none" onchange="onPhotoPick(this,\''+esc(l.id)+'\')">'
    +   '<div id="ph-status" class="muted" style="font-size:12.5px;margin:6px 0 2px"></div>'
    +   '<div id="photos"><div class="muted" style="font-size:13px">Loading photos…</div></div>'
    + '</div>'
    + '</div>';
  loadJobPhotos(l.id).then(ph=>{ const el=document.getElementById('photos'); if(!el) return;
    el.innerHTML = ph.length? '<div class="pgrid">'+ph.map(p=>'<a class="pcell" href="'+esc(p.url)+'" target="_blank" rel="noopener"><img src="'+esc(p.url)+'" loading="lazy" decoding="async" alt=""></a>').join('')+'</div>' : '<div class="muted" style="font-size:13px">No photos yet.</div>';
  }).catch(()=>{});

async function saveWalkdown(jobId){

    const sel=document.getElementById(fid); if(!sel) return '';
    const v=(sel.value||'').trim();
    if(v==='Other'){ const o=document.getElementById(fid+'-other'); return o?(o.value||'').trim():''; }
    return v;
  };
  const service=g('wd-service'), panel=g('wd-panel'), breaker=g('wd-breaker'), spaces=g('wd-spaces'), notes=g('wd-notes');
  loading('Saving walkdown…');
  try{
    await syncFromSP().catch(()=>{});
    const arr=getLeads(); const i=arr.findIndex(l=>l.id===jobId); if(i<0) throw new Error('job not found');

function _dataUrlToBlob(d){ const a=d.split(','),m=a[0].match(/:(.*?);/)[1],b=atob(a[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return new Blob([u],{type:m}); }
async function resizeImage(file, maxDim, quality){
  const dataUrl = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); });
  if(!/^image\//.test(file.type||'')) return { blob:_dataUrlToBlob(dataUrl), name:file.name||'file', type:file.type||'application/octet-stream' };
  return await new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{ try{ let w=img.width,h=img.height; if(!w||!h) return reject(new Error('decode 0x0'));
      if(w>maxDim||h>maxDim){ if(w>h){ h=Math.round(h/w*maxDim); w=maxDim; } else { w=Math.round(w/h*maxDim); h=maxDim; } }
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>{ if(!b) return reject(new Error('toBlob null')); resolve({ blob:b, name:(file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg', type:'image/jpeg' }); },'image/jpeg',quality);
    }catch(e){ reject(e); } };
    img.onerror=()=>reject(new Error('image decode failed')); img.src=dataUrl;
  });
}
async function graphPatch(path, bodyObj){
  const r=await fetch('https://graph.microsoft.com/v1.0'+path,{method:'PATCH',headers:{Authorization:'Bearer '+_gToken,'Content-Type':'application/json'},body:JSON.stringify(bodyObj)});
  if(!r.ok) throw new Error('PATCH '+r.status); return r.json().catch(()=>null);
}
// All photos land in the job's install/ folder (which the CRM already auto-pulls);
// the shot TYPE is tagged as a "<key>__" filename prefix so the checklist can tell
// which required shots are done without needing extra SharePoint folders.
async function uploadPhoto(jobId, file, catKey){
  if(!_spDrive) throw new Error('no drive');
  const conv = await resizeImage(file, 2048, 0.88);
  const tag = (catKey||'other').replace(/[^a-z0-9-]/gi,'');
  const fname = tag+'__'+Date.now()+'_'+(conv.name||'photo.jpg').replace(/[^A-Za-z0-9._-]/g,'_');
  const path = SP_PHOTO_LIB+'/'+jobId+'/install/'+fname;       // CRM auto-pulls this folder
  const r = await fetch('https://graph.microsoft.com/v1.0/drives/'+_spDrive+'/root:/'+encodeURI(path)+':/content',
    { method:'PUT', headers:{ Authorization:'Bearer '+_gToken, 'Content-Type':conv.type||'image/jpeg' }, body:conv.blob });
  if(!r.ok) throw new Error('upload '+r.status);
  return true;
}

// Safe single-lead write: re-pull fresh, modify, merge by id+updatedAt, PATCH the list item.
async function pushLeads(){
  if(!_spList) throw new Error('no list');
  let itemId=null, spVal=null, next='/sites/'+_spSite+'/lists/'+_spList+'/items?$expand=fields&$top=200';
  while(next){ const res=await graphFetch(next); for(const it of (res.value||[])){ if(it.fields&&it.fields.Title==='gk_leads'){ itemId=it.id; spVal=it.fields.DataValue; } } next=res['@odata.nextLink']||null; }
  let merged=getLeads();
  if(spVal){ try{ const spArr=JSON.parse(spVal); const map=new Map(); for(const r of spArr) map.set(r.id,r);
    for(const r of getLeads()){ const ex=map.get(r.id); if(!ex || (r.updatedAt && (!ex.updatedAt || r.updatedAt>ex.updatedAt))) map.set(r.id,r); }
    merged=[...map.values()]; }catch(e){} }
  localStorage.setItem('gk_leads', JSON.stringify(merged));
  if(itemId) await graphPatch('/sites/'+_spSite+'/lists/'+_spList+'/items/'+itemId+'/fields', { DataValue: JSON.stringify(merged) });
}
async function markComplete(jobId, done){

  const arr=getLeads(); const i=arr.findIndex(l=>l.id===jobId); if(i<0) throw new Error('job not found');
  if(!arr[i].milestones) arr[i].milestones={};

  else { delete arr[i].milestones.installCompleted; }

}

// Completed, with a soft pre-flight checklist (never a hard block — the tech
// can always complete, but has to acknowledge what's missing).
async function doCompleteGated(jobId){
  const l=getLeads().find(x=>x.id===jobId); if(!l){ alert('Job not found'); return; }
  const missing=[];
  try{
    const ph=await loadJobPhotos(jobId);
    const miss=INSTALL_SHOTS.filter(s=>!_shotDone(ph,s.key)).length;
    if(miss>0) missing.push(miss+' of '+INSTALL_SHOTS.length+' required photos not taken');
  }catch(e){ missing.push('Could not verify required photos (no signal?)'); }
  if(isDirect(l) && !l.payment) missing.push('Payment not recorded (collect or text a pay link first)');
  if(!(l.milestones&&l.milestones.techArrived&&l.milestones.techArrived.done)) missing.push('\u201cI\u2019ve arrived\u201d was never tapped (completion will still record)');
  let msg;
  if(missing.length){
    msg='Before you complete this job:\n\n\u2022 '+missing.join('\n\u2022 ')
      +'\n\nIf the scope changed on site, use \u201cAdjust amount\u201d first so the office bills right.\n\nComplete anyway?';
  }else{
    msg='Everything checks out — photos done'+(isDirect(l)?', payment recorded':'')+'.\n\nMark this install complete? It moves the job to Post-Install for the office.';
  }

  loading('Marking complete…');

  renderDetail(jobId);
}

async function _fetchFldThread(jobId, quiet){
  const el=document.getElementById('fld-sms-thread');
  if(!el){ _stopFldSms(); return; }                    // screen changed — stop polling
  if(!quiet) el.innerHTML='<div class="muted" style="font-size:13px">Loading conversation…</div>';
  try{
    const token=await _acquireWorkerToken();
    const r=await fetch(SMS_WORKER_URL+'/sms/thread?leadId='+encodeURIComponent(jobId),{headers:{Authorization:'Bearer '+token}});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||'Could not load');
    const msgs=d.messages||[];
    const el2=document.getElementById('fld-sms-thread'); if(!el2){ _stopFldSms(); return; }
    if(!msgs.length){ el2.innerHTML='<div class="muted" style="font-size:13px">No messages yet — say hello or send \u201cOn my way\u201d.</div>'; return; }
    const pinned=(el2.scrollHeight-el2.scrollTop-el2.clientHeight)<30;
    el2.innerHTML=msgs.map(function(m){
      const out=m.direction==='out';
      const who=out?((m.user_upn?m.user_upn.split('@')[0]:'GreenKey')):'Customer';
      const dt=new Date(m.created_at);
      const ts=dt.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
      let media='';
      if(m.media_json){ try{ const items=JSON.parse(m.media_json)||[];
        media=items.map(function(it){ const u=(it&&it.url)?String(it.url):''; if(!u) return '';
          return /twilio\.com/i.test(u)
            ? '<div data-twmedia="'+esc(u)+'" class="muted" style="font-size:12px">📷 photo — loading…</div>'
            : '<img src="'+esc(u)+'" style="max-width:150px;border-radius:8px;display:block;margin:2px 0" alt="photo">';
        }).join(''); }catch(e){} }
      return '<div style="display:flex;justify-content:'+(out?'flex-end':'flex-start')+';margin:3px 0">'
        + '<div style="max-width:78%;padding:6px 10px;border-radius:10px;font-size:14px;line-height:1.35;white-space:pre-wrap;word-break:break-word;'
        + (out?'background:#12351f;border:1px solid #2b6a41;color:#d9f2e2':'background:#161b24;border:1px solid #2a3140;color:#e8eaed')+'">'
        + media + (m.body?esc(m.body):'')

        + '</div></div>';
    }).join('');
    _hydrateFldMedia(el2);
    if(!quiet || pinned) el2.scrollTop=el2.scrollHeight;
  }catch(e){
    const el3=document.getElementById('fld-sms-thread');
    if(el3 && !quiet) el3.innerHTML='<div class="muted" style="font-size:13px">Couldn\u2019t load texts ('+esc(e.message||'error')+'). Check signal and try again.</div>';
  }
}
async function _hydrateFldMedia(root){
  const nodes=root.querySelectorAll('[data-twmedia]'); if(!nodes.length) return;
  let token; try{ token=await _acquireWorkerToken(); }catch(e){ return; }
  for(const n of nodes){
    const u=n.getAttribute('data-twmedia'); n.removeAttribute('data-twmedia');
    try{
      const r=await fetch(SMS_WORKER_URL+'/sms/media?url='+encodeURIComponent(u),{headers:{Authorization:'Bearer '+token}});
      if(!r.ok) throw new Error();
      const b=await r.blob(); const obj=URL.createObjectURL(b);
      const img=document.createElement('img'); img.src=obj; img.alt='photo';
      img.style.cssText='max-width:150px;border-radius:8px;display:block;margin:2px 0';
      n.replaceWith(img);
    }catch(e){ n.textContent='📷 photo — view in the office CRM'; }
  }
}

// Phone-style auto-grow for the composer (field-13). The box shows three lines
// at rest (CSS min-height) and grows with the message up to the CSS max-height,
// after which it scrolls — so the tech can always read back and reword what he
// typed instead of watching one line slide past.
// PERFORMANCE: measuring scrollHeight forces a reflow, so this never runs once
// per keystroke — calls are coalesced into a single measure+write per animation
// frame. Fast typing or a paste costs one reflow, not one per character.
let _smsGrowRAF=null;
function _smsGrow(){
  if(_smsGrowRAF) return;
  _smsGrowRAF=requestAnimationFrame(function(){
    _smsGrowRAF=null;
    const t=document.getElementById('fld-sms-reply'); if(!t) return;   // screen changed
    t.style.height='auto';                                             // allow shrink

  });
}

function toggleZelleQR(jobId){
  const box=document.getElementById('zelleqr'); if(!box) return;
  const show = box.style.display==='none';
  box.style.display = show?'':'none';
  // Timestamp the ask (Jonathan 2026-07-21): an in-person Zelle deposit lands
  // within minutes of the QR being shown, so job + amount + THIS timestamp is
  // the office's strongest match signal if the tech forgets to record it.
  if(show && jobId){
    (async()=>{ try{
      const arr=getLeads(); const j=arr.findIndex(x=>x.id===jobId);
      if(j>=0 && !(arr[j].payment&&arr[j].payment.collectedAt)){
        arr[j].paymentExpected={amount:(jobPayAmounts(arr[j]).net||0),methods:['zelle'],at:new Date().toISOString(),source:'field-qr',memoCode:payMemoCode(jobId)};
        arr[j].updatedAt=new Date().toISOString();
        localStorage.setItem('gk_leads',JSON.stringify(arr));
        await pushLeads();
      }
    }catch(e){ console.warn('[field] qr-shown stamp',e); } })();
  }
  const img=document.getElementById('zelleqr-img');
  if(!show || !img || img.childNodes.length) return;   // hidden, or already drawn in THIS render
  const draw=()=>{ img.innerHTML='<img src="'+ZELLE_QR_DATAURI+'" alt="Zelle QR" style="width:200px;height:200px;image-rendering:pixelated">'; };
  draw();   // embedded data URI — no CDN, no network needed

// ---------- payment (Phase 3): record collected payment, sync back ----------
// Stamp lead.payment AND the paymentReceived milestone together. The office
// auto-archive fires on (final inspection passed + paymentReceived.done); before
// this, a field payment never set that milestone, so paid jobs never auto-closed.
// Direct jobs only — platform jobs are invoiced by the platform and don't gate.
function _stampPaymentMilestone(lead, amount, isoNow){
  if(!PLATFORMS.includes(lead.source)){
    if(!lead.milestones) lead.milestones={};
    lead.milestones.paymentReceived = { done:true, date:isoNow.slice(0,10), amount:amount||0 };
  }
}
async function recordPayment(jobId, method, amount){
  try{ await syncFromSP(); }catch(e){}
  const arr=getLeads(); const i=arr.findIndex(l=>l.id===jobId); if(i<0) throw new Error('job not found');
  const now=new Date().toISOString();
  arr[i].payment = { method:method, amount:amount||0, collectedAt:now };
  _stampPaymentMilestone(arr[i], amount, now);
  arr[i].updatedAt = now;
  localStorage.setItem('gk_leads', JSON.stringify(arr));
  await pushLeads();
}
async function clearPayment(jobId){
  try{ await syncFromSP(); }catch(e){}
  const arr=getLeads(); const i=arr.findIndex(l=>l.id===jobId); if(i<0) return;
  delete arr[i].payment;
  if(arr[i].milestones && arr[i].milestones.paymentReceived) delete arr[i].milestones.paymentReceived;
  arr[i].updatedAt=new Date().toISOString();
  localStorage.setItem('gk_leads', JSON.stringify(arr));
  await pushLeads();
}

// ---------- on-site amount adjustment (amount + required note; office sees it) ----------
async function adjustAmount(jobId){
  const l=getLeads().find(x=>x.id===jobId); if(!l){ alert('Job not found'); return; }
  const cur=(l.priceOverride&&typeof l.priceOverride.amount==='number')?l.priceOverride.amount:(quoteAmounts(l).net||'');
  const v=prompt('Adjusted amount to collect ($):', cur===''?'':String(cur)); if(v===null) return;
  const amt=Math.round(parseFloat(v)||0); if(!amt||amt<=0){ alert('Enter a valid amount.'); return; }
  const note=prompt('Reason for the change (required — the office will see this):',''); if(note===null) return;
  if(!note.trim()){ alert('A reason is required so the office knows why it changed.'); return; }
  loading('Saving adjustment…');
  try{ await _saveAdjust(jobId, amt, note.trim()); }catch(e){ alert('Could not save: '+(e.message||e)); }
  renderDetail(jobId);
}
async function _saveAdjust(jobId, amount, note){
  try{ await syncFromSP(); }catch(e){}
  const arr=getLeads(); const i=arr.findIndex(l=>l.id===jobId); if(i<0) throw new Error('job not found');
  const acct=_msal&&_msal.getAllAccounts()[0]; const who=(acct&&(acct.name||acct.username))||'';
  arr[i].priceOverride={ amount:amount, note:note, by:who, at:new Date().toISOString() };
  arr[i].updatedAt=new Date().toISOString();
  localStorage.setItem('gk_leads', JSON.stringify(arr));
  await pushLeads();
}
async function clearAdjust(jobId){
  if(!confirm('Undo the on-site amount adjustment (back to the quoted amount)?')) return;
  loading('Updating…');
  try{ await syncFromSP(); const arr=getLeads(); const i=arr.findIndex(l=>l.id===jobId);
    if(i>=0){ delete arr[i].priceOverride; arr[i].updatedAt=new Date().toISOString(); localStorage.setItem('gk_leads',JSON.stringify(arr)); await pushLeads(); } }
  catch(e){ alert(e.message||e); }
  renderDetail(jobId);
}

// Tap to Pay: web apps can't run Tap to Pay directly (Apple requires a native
// app), so this shows the amount and walks the tech to the Stripe app, then back
// to record it. No pre-fill of the amount is possible from here.
function tapToPay(jobId){
  const l=getLeads().find(x=>x.id===jobId); if(!l) return;
  const amt=jobPayAmounts(l).card;
  alert('Tap to Pay\n\n1) Open the Stripe app and start a Tap to Pay charge for '+(amt?fmt$(amt):'the amount')+'.\n2) Tap the customer’s card or phone.\n3) Come back here and tap “✓ Card paid — record it”.');
}

// ---------- Stripe pay link: create + text from the business number ----------
async function _acquireWorkerToken(){
  const a=_msal.getAllAccounts()[0]; if(!a) throw new Error('Not signed in');
  try{ const r=await _msal.acquireTokenSilent({account:a,scopes:[SMS_SCOPE_URL]}); return r.accessToken; }
  catch(e){ const r=await _msal.acquireTokenSilent({account:a,scopes:[SMS_SCOPE_URL],forceRefresh:true}); return r.accessToken; }
}
async function textPayLink(jobId){
  const l=getLeads().find(x=>x.id===jobId); if(!l){ alert('Job not found'); return; }
  if(!isDirect(l)){ alert(l.source+' invoices the customer — do not collect on site.'); return; }
  const phone=leadPhone(l);
  if(!phone){ alert('No phone number on file for this customer — add one in the CRM first.'); return; }
  let amt=jobPayAmounts(l).card;
  if(!amt){ const v=prompt('Card amount to charge ($):',''); if(v===null) return; amt=Math.round(parseFloat(v)||0); }
  if(!amt||amt<=0){ alert('Enter a valid amount.'); return; }
  if(!confirm('Text a card payment link for '+fmt$(amt)+' to '+custName(l)+' ('+phone+')?')) return;
  loading('Creating payment link…');
  try{
    const token=await _acquireWorkerToken();
    const lr=await fetch(SMS_WORKER_URL+'/stripe/link',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({leadId:l.id,amount:amt,customerName:custName(l),description:prettyType(l.jobType)})});
    const ld=await lr.json().catch(()=>({}));
    if(!lr.ok||!ld.url) throw new Error(ld.error||'Could not create link');
    const first=(custName(l).trim().split(/\s+/)[0])||'there';
    const msg='Hi '+first+', here is your secure GreenKey card payment link for '+fmt$(amt)+': '+ld.url+'\nThank you! — GreenKey';
    const sr=await fetch(SMS_WORKER_URL+'/sms/send',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({leadId:l.id,to:phone,message:msg,templateKey:'stripe_pay_link',customerName:custName(l)})});
    const sd=await sr.json().catch(()=>({}));
    if(!sr.ok) throw new Error(sd.error||'Link created but the text failed to send');
    alert('✓ Payment link texted to '+custName(l)+'.\nThey pay by card — it shows here in the office once it clears.');
    // Track the ask on the office Payments page (cleared when payment lands).
    try{
      const arr2=getLeads(); const j=arr2.findIndex(x=>x.id===l.id);
      if(j>=0 && !(arr2[j].payment&&arr2[j].payment.collectedAt)){
        arr2[j].paymentExpected={amount:amt,methods:['card-link'],at:new Date().toISOString(),source:'field-link',memoCode:payMemoCode(l.id)};
        arr2[j].updatedAt=new Date().toISOString();
        localStorage.setItem('gk_leads',JSON.stringify(arr2));
        await pushLeads();
      }
    }catch(_){}
  }catch(e){ alert('Could not send pay link: '+(e.message||e)); }
  renderDetail(jobId);
}
async function doPayment(jobId, method, amount){
  if(!amount){ const v=prompt('Amount collected ($):',''); if(v===null) return; amount=Math.round(parseFloat(v)||0); }
  const label = method==='card'?'card':(method==='zelle'?'Zelle':'cash/check');
  if(!confirm('Record '+fmt$(amount)+' '+label+' payment collected for this job?')) return;
  loading('Recording payment…');
  try{ await recordPayment(jobId, method, amount); }catch(e){ alert('Could not record: '+(e.message||e)); }
  renderDetail(jobId);
}
async function doClearPayment(jobId){
  if(!confirm('Undo the recorded payment?')) return;
  loading('Updating…');
  try{ await clearPayment(jobId); }catch(e){ alert(e.message||e); }
  renderDetail(jobId);
}

// ---------- self-update check (field-13) ----------
// WHY THIS EXISTS. The app is one HTML file on GitHub Pages, added to the iOS
// home screen. A home-screen web app gets its own cache with no address bar, no
// reload button, and no gesture that bypasses it — so a pushed change could sit
// unseen for as long as that cache held it, and the only reliable cure was
// deleting the icon and re-adding it from a pasted URL. Jonathan, 2026-08-01:
// "having to delete the app and reload it via pasting an address … is a problem."
//
// So the app watches its own build stamp. The check is a conditional request:
// `cache:'no-cache'` means the browser always asks the server, sending the ETag —
// unchanged is a ~300-byte 304, changed is a full 200 that ALSO writes the new
// copy into the browser cache. That last part is the whole trick: it is what
// makes the plain location.reload() below actually serve new code.
//
// ⚠ It NEVER reloads on its own. A tech halfway through a text or a photo upload
// decides when. The bar is the only thing that appears by itself.
const UPD_CHECK_MS = 15*60*1000;          // foreground re-check interval
let _updLast = 0, _updOffered = '';
function _updBuildFrom(txt){
  // Built via RegExp() rather than a literal so this line can never match itself.
  const m = new RegExp("const BUILD\\s*=\\s*'([^']+)'").exec(txt);
  return m ? m[1] : '';
}
// True when we escalated to a ?v= URL and STILL came up on the old build —
// i.e. the cache beat us and there is nothing more the page can do by itself.
function _updStuck(){
  const m = /[?&]v=([^&]+)/.exec(location.search||'');
  try{ return !!(m && decodeURIComponent(m[1]) !== BUILD); }catch(e){ return false; }
}
async function checkForUpdate(force){
  const now = Date.now();
  if(!force && now - _updLast < UPD_CHECK_MS) return;
  _updLast = now;
  try{
    const r = await fetch(location.pathname, {cache:'no-cache'});
    if(!r.ok) return;
    const live = _updBuildFrom(await r.text());
    if(!live) return;                               // not our file (404 page?)
    if(live === BUILD){ _updClearBar(); return; }   // already current
    if(live === _updOffered) return;                // bar is already up for this one
    let dismissed=''; try{ dismissed = localStorage.getItem('gk_upd_dismissed')||''; }catch(e){}
    if(dismissed === live) return;                  // he said not now
    _updOffered = live;
    _updShowBar(live);
  }catch(e){ /* no signal / blocked — silent, we try again next foreground */ }
}
function _updClearBar(){ const b=document.getElementById('updbar'); if(b) b.remove(); }
function _updShowBar(live){
  _updClearBar();
  const stuck = _updStuck();
  const d = document.createElement('div');
  d.id='updbar'; d.className='updbar';
  d.innerHTML = '<div class="t">'
      + (stuck ? 'Update didn’t take — force-quit the app and reopen it.'
               : 'Update ready — ' + esc(live))
      + '</div>'
    + (stuck ? '' : '<button class="go" id="updgo">Update</button>')
    + '<button class="x" id="updx" aria-label="Not now">✕</button>';
  document.body.appendChild(d);
  const go = document.getElementById('updgo');
  if(go) go.onclick = function(){ applyUpdate(live); };
  document.getElementById('updx').onclick = function(){
    try{ localStorage.setItem('gk_upd_dismissed', live); }catch(e){}
    _updClearBar();
  };
}
// Stage 1: a plain reload. The check above already refreshed the cached copy, so
// this is normally all it takes.
function applyUpdate(live){
  try{ localStorage.removeItem('gk_upd_dismissed'); }catch(e){}
  try{ sessionStorage.setItem('gk_upd_want', live); }catch(e){}
  location.reload();
}
// Stage 2, run on the way back up: if the reload handed us the OLD build anyway,
// go to the same file under a ?v= query — a cache key iOS has never seen and
// therefore cannot answer from cache. Runs before boot so nothing else loads
// first. Terminates by design: the marker is consumed here, so the worst case is
// one escalation per tap, and _updStuck() then tells the truth instead of looping.
function _updAfterReload(){
  let want=''; try{ want = sessionStorage.getItem('gk_upd_want')||''; }catch(e){}
  if(!want) return;
  try{ sessionStorage.removeItem('gk_upd_want'); }catch(e){}
  if(want === BUILD) return;                        // stage 1 did it
  location.replace(location.pathname + '?v=' + encodeURIComponent(want));
}
_updAfterReload();
// Runs whether or not anyone is signed in — a stale copy is stale on the login
// screen too, and Chase should get the bar before he has to think about it.
checkForUpdate(true);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkForUpdate(false); });

// ---------- boot ----------
(async function boot(){
  try{
    const account = await initAuth();
    if(!account){ renderLogin(); return; }
    const tok = await getTokenSilent();
    if(!tok){ renderLogin(); return; }
    const hadData = getLeads().length>0;
    if(!hadData) loading('Loading your jobs…');
    try{ await spInit(); await syncFromSP(); }
    catch(e){ console.warn('[field] sync', e); if(!hadData){ $app().innerHTML='<div class="center"><div class="err">Could not load jobs.</div><div class="muted" style="font-size:13px;max-width:300px">'+esc(e.message||e)+'</div><button class="btn ghost" style="max-width:240px" onclick="location.reload()">Retry</button><button class="btn ghost" style="max-width:240px" onclick="signOut()">Sign out</button></div>'; return; } }
    // Always open on My Jobs (field-14, Jonathan 2026-08-03). iOS relaunches the
    // saved app with its last URL, so a leftover #job= hash restored whatever job
    // was open when the phone was put away. Strip it here — replaceState so no
    // hashchange fires — then route() lands on the list. refresh() still keeps
    // you on the job you're looking at; only a cold open comes home.
    if(location.hash){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; } }
    route();
  }catch(e){
    console.error('[field] boot', e);
    $app().innerHTML='<div class="center"><div class="err">Sign-in problem</div><div class="muted" style="font-size:13px;max-width:300px">'+esc(e.message||e)+'</div><button class="btn green" style="max-width:240px" onclick="signIn()">Sign in with Microsoft</button></div>';
  }
})();
</script>
